<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<title>Your Job Postings — Verde Talent</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;text-decoration:none;color:inherit;}
.logo-img{height:104px;width:auto;display:block;}
.nav-right{display:flex;gap:20px;align-items:center;font-size:13px;}
.nav-right a{color:var(--t2);text-decoration:none;}
.nav-right a:hover{color:var(--grn);}
.wrap{max-width:800px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.75rem;flex-wrap:wrap;gap:12px;}
.hero h1{font-size:26px;font-weight:700;}
.hero p{font-size:13px;color:var(--t3);margin-top:4px;}
.btn-grn{background:var(--grn);color:#052e1e;border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);white-space:nowrap;}
.btn-ghost{background:transparent;color:var(--t1);border:0.5px solid var(--bdr2);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);}
.btn-ghost:hover{border-color:rgba(34,224,154,0.4);color:var(--grn);}

.month-row{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.month-row label{font-size:12px;color:var(--t3);}
.month-select{background:var(--card2);border:0.5px solid var(--bdr2);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--t1);outline:none;font-family:var(--font-sans);}
.month-select:focus{border-color:rgba(34,224,154,0.5);}

.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin:2rem 0 .75rem;display:flex;align-items:center;gap:8px;}
.section-title:first-of-type{margin-top:0;}
.section-count{background:var(--card2);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--t2);}

.card{background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:10px;border-left:3px solid var(--grn);transition:border-color .15s;}
.card.inactive{border-left-color:var(--bdr2);opacity:.85;}
.card:hover{border-color:var(--bdr2);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.card h2{font-size:16px;font-weight:600;margin-bottom:2px;}
.co-line{font-size:13px;color:var(--t2);}
.card-actions{display:flex;gap:8px;flex-shrink:0;}
.status-row{font-size:12px;color:var(--t3);margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.pill.paid{color:var(--grn);background:rgba(34,224,154,0.1);border:0.5px solid rgba(34,224,154,0.3);}
.pill.pending_payment{color:var(--amb);background:rgba(255,181,71,0.1);border:0.5px solid rgba(255,181,71,0.3);}
.pill.expired{color:var(--t3);background:rgba(255,255,255,0.05);border:0.5px solid var(--bdr2);}
.pill.removed{color:var(--cor);background:rgba(255,112,85,0.08);border:0.5px solid rgba(255,112,85,0.25);}
.pill i{font-size:11px;}

.btn-remove{background:transparent;color:var(--cor);border:1px solid rgba(255,112,85,0.35);padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;}
.btn-remove:hover{background:rgba(255,112,85,0.08);}
.btn-remove:disabled{opacity:.5;cursor:default;}
.btn-repost{background:rgba(34,224,154,0.1);color:var(--grn);border:1px solid rgba(34,224,154,0.35);padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.btn-repost:hover{background:rgba(34,224,154,0.18);}

.card-note{font-size:12px;color:var(--t3);margin-top:8px;line-height:1.6;}
.card-note.error{color:var(--cor);}
.card-note.success{color:var(--grn);}
.state-note{font-size:14px;color:var(--t3);padding:3rem 0;text-align:center;line-height:1.8;}
.empty-inline{font-size:12px;color:var(--t3);padding:.5rem 0 .25rem;}
footer{border-top:0.5px solid var(--bdr);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--t3);}
footer a{color:var(--t3);text-decoration:none;}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html"><img src="logo.webp" alt="Verde Talent" class="logo-img"></a>
  <div class="nav-right">
    <a href="employer-account.html">Account &amp; credits</a>
    <a href="post-job.html">Post a job</a>
    <a href="#" id="signOutLink">Sign out</a>
  </div>
</nav>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>Your job postings</h1>
      <p id="accountEmail"></p>
    </div>
    <a class="btn-grn" href="post-job.html"><i class="ti ti-plus"></i>Post another job</a>
  </div>
  <div id="content" class="state-note">Loading…</div>

  <div id="historySection" style="display:none;margin-top:1.25rem;">
    <div class="section-title" style="justify-content:space-between;">
      <span>Expired &amp; removed <span class="section-count" id="historyCount">0</span></span>
      <div class="month-row" style="margin-bottom:0;">
        <label for="monthSelect">Month</label>
        <select class="month-select" id="monthSelect"></select>
      </div>
    </div>
    <div id="historyContent"></div>
  </div>
</div>
<footer>&copy; 2026 Verde Talent &middot; <a href="mailto:contact@verdetalent.com">contact@verdetalent.com</a></footer>
<script>
const SUPABASE_URL = 'https://iqcyofkosjopxsfdufvy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fNT-RdlQa_K6O9dxPYxkA__mHmbJNH';
const MANAGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/manage-posting`;

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getEmployerSession() {
  try {
    const raw = localStorage.getItem('vt_employer_session');
    if (!raw) return null;
    const session = JSON.parse(raw);
    if (!session.access_token || session.expires_at < Date.now()) return null;
    return session;
  } catch {
    return null;
  }
}

const session = getEmployerSession();
if (!session) {
  window.location.href = 'employer-login.html';
} else {
  document.getElementById('accountEmail').textContent = session.email;
}

document.getElementById('signOutLink').addEventListener('click', function(e){
  e.preventDefault();
  localStorage.removeItem('vt_employer_session');
  window.location.href = 'employer-login.html';
});

async function callManage(body) {
  const res = await fetch(MANAGE_FUNCTION_URL, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${session.access_token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

// A "paid" posting whose expires_at has passed reads as expired even
// though nothing in the database ever flips its status column - the same
// rule public_job_postings already applies to decide what's visible on
// the live site, just evaluated here for display grouping instead.
function isExpired(p) {
  return p.status === 'paid' && p.expires_at && new Date(p.expires_at) < new Date();
}
function isInactive(p) {
  return p.status === 'removed' || isExpired(p);
}

const STATUS_META = {
  paid: { label: 'Live', icon: 'ti-circle-check' },
  pending_payment: { label: 'Payment pending', icon: 'ti-clock' },
  removed: { label: 'Removed', icon: 'ti-trash' },
};

function statusPill(posting) {
  if (isExpired(posting)) {
    return `<span class="pill expired"><i class="ti ti-hourglass-off"></i>Expired</span>`;
  }
  const meta = STATUS_META[posting.status] || { label: posting.status, icon: 'ti-info-circle' };
  return `<span class="pill ${escapeHtml(posting.status)}"><i class="ti ${meta.icon}"></i>${escapeHtml(meta.label)}</span>`;
}

function activeCardHtml(posting) {
  const expiresLine = posting.expires_at ? `Runs through ${new Date(posting.expires_at).toLocaleDateString()}` : '';
  const removeBtn = posting.status === 'paid' ? `<button type="button" class="btn-remove" data-action="remove">Remove</button>` : '';
  return `
    <div class="card" data-id="${posting.id}">
      <div class="card-top">
        <div>
          <h2>${escapeHtml(posting.job_title)}</h2>
          <div class="co-line">${escapeHtml(posting.company_name)}</div>
        </div>
        <div class="card-actions">${removeBtn}</div>
      </div>
      <div class="status-row">${statusPill(posting)}${expiresLine ? `<span>${expiresLine}</span>` : ''}</div>
      <div class="card-note"></div>
    </div>`;
}

function inactiveCardHtml(posting) {
  const endedLine = posting.expires_at
    ? (isExpired(posting) ? `Expired ${new Date(posting.expires_at).toLocaleDateString()}` : `Removed`)
    : '';
  return `
    <div class="card inactive" data-id="${posting.id}">
      <div class="card-top">
        <div>
          <h2>${escapeHtml(posting.job_title)}</h2>
          <div class="co-line">${escapeHtml(posting.company_name)}</div>
        </div>
        <div class="card-actions">
          <a class="btn-repost" href="post-job.html?repost=${posting.id}"><i class="ti ti-recycle"></i>Repost &amp; pay</a>
        </div>
      </div>
      <div class="status-row">${statusPill(posting)}${endedLine ? `<span>${endedLine}</span>` : ''}</div>
    </div>`;
}

const MONTH_LABEL = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' });
function monthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

let allPostings = [];

function attachRemoveHandlers(container, afterRemove) {
  container.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener('click', async function(){
      const card = this.closest('.card');
      const id = card.dataset.id;
      const note = card.querySelector('.card-note');
      if (!confirm('Remove this posting from Verde Talent? This cannot be undone.')) return;
      this.disabled = true;
      this.textContent = 'Removing…';
      try {
        await callManage({ action: 'delete', id });
        const posting = allPostings.find(p => p.id === id);
        if (posting) posting.status = 'removed';
        afterRemove();
      } catch (err) {
        this.disabled = false;
        this.textContent = 'Remove';
        note.className = 'card-note error';
        note.textContent = err.message;
      }
    });
  });
}

// Active postings are always a small, bounded list - however long you've
// been using the platform, you only ever have a handful live at once - so
// there's no reason to hide any of them behind a month filter. It's the
// expired/removed history that grows without bound over time and actually
// benefits from being chunked by month instead of one long scroll.
function renderActive() {
  const content = document.getElementById('content');
  const active = allPostings.filter(p => !isInactive(p));

  let html = `<div class="section-title">Active <span class="section-count">${active.length}</span></div>`;
  html += active.length
    ? active.map(activeCardHtml).join('')
    : `<div class="empty-inline">Nothing currently live or pending.</div>`;
  content.innerHTML = html;

  attachRemoveHandlers(content, () => { renderActive(); renderHistoryMonth(document.getElementById('monthSelect').value); });
}

// Only the selected month's expired/removed postings are ever rendered -
// older months stay collapsed behind the dropdown rather than all loading
// in one long list.
function renderHistoryMonth(key) {
  const historyContent = document.getElementById('historyContent');
  const historyCount = document.getElementById('historyCount');
  const monthPostings = allPostings.filter(p => isInactive(p) && monthKey(p.created_at) === key);

  historyCount.textContent = monthPostings.length;
  historyContent.innerHTML = monthPostings.length
    ? monthPostings.map(inactiveCardHtml).join('')
    : `<div class="empty-inline">Nothing here in ${escapeHtml(MONTH_LABEL.format(new Date(key + '-02')))}.</div>`;
}

function buildMonthSelector() {
  const inactivePostings = allPostings.filter(isInactive);
  document.getElementById('historySection').style.display = inactivePostings.length ? 'block' : 'none';
  if (!inactivePostings.length) return;

  const counts = {};
  inactivePostings.forEach(p => {
    const key = monthKey(p.created_at);
    counts[key] = (counts[key] || 0) + 1;
  });
  const currentKey = monthKey(new Date().toISOString());
  if (!counts[currentKey]) counts[currentKey] = 0; // always offer the current month, even with nothing expired/removed yet

  const keys = Object.keys(counts).sort().reverse();
  const select = document.getElementById('monthSelect');
  select.innerHTML = keys.map(key =>
    `<option value="${key}">${escapeHtml(MONTH_LABEL.format(new Date(key + '-02')))} (${counts[key]})</option>`
  ).join('');
  select.value = currentKey;

  select.addEventListener('change', () => renderHistoryMonth(select.value));
  renderHistoryMonth(currentKey);
}

async function loadPostings() {
  const content = document.getElementById('content');
  try {
    const data = await callManage({ action: 'list' });
    if (!data.postings.length) {
      content.innerHTML = `<div class="state-note">You haven't posted any jobs yet.<br><a href="post-job.html" style="color:var(--grn);">Post your first one →</a></div>`;
      return;
    }
    allPostings = data.postings;
    renderActive();
    buildMonthSelector();
  } catch (err) {
    content.textContent = err.message || 'Could not load your postings.';
  }
}

if (session) loadPostings();
</script>
</body>
</html>
