<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--pur:#B588FF;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;position:relative;}
.nav-toggle{display:none;background:none;border:0.5px solid var(--bdr2);color:var(--t2);width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;text-decoration:none;color:inherit;}
.logo-img{height:104px;width:auto;display:block;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grn);}
.nav-links{display:flex;align-items:center;gap:1.1rem;font-size:13px;}
.nav-links a{color:var(--t2);text-decoration:none;white-space:nowrap;}
.nav-links a:hover{color:var(--grn);}
.nav-links a.active{color:var(--t1);}
.nav-group.grn .nav-links a.active{color:var(--grn);}
.nav-group.amb .nav-links a.active{color:var(--amb);}
.nav-groups{display:flex;align-items:flex-end;flex:1;justify-content:space-evenly;}
.nav-group{display:flex;flex-direction:column;gap:6px;}
.nav-group + .nav-group{margin-left:14px;padding-left:14px;border-left:0.5px solid var(--bdr2);}
.nav-group-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;height:12px;line-height:12px;}
.nav-group-label.grn{color:var(--grn);}
.nav-group-label.amb{color:var(--amb);}
.btn{padding:8px 16px;border-radius:9px;font-size:13px;cursor:pointer;border:none;font-family:var(--font-sans);white-space:nowrap;}
.btn-grn{background:var(--grn);color:#052e1e;font-weight:500;}
.btn-ghost{background:none;border:0.5px solid var(--bdr2);color:var(--t2);}
.signin-wrap{position:relative;}
.signin-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:0.5px solid var(--bdr2);border-radius:10px;padding:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:60;}
.signin-menu.open{display:block;}
.signin-menu a{display:block;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--t2);text-decoration:none;}
.signin-menu a:hover{background:var(--card2);color:var(--t1);}
.signin-menu .si-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px 2px;}
.signin-menu .si-label.grn{color:var(--grn);}
.signin-menu .si-label.amb{color:var(--amb);}
.breadcrumb{padding:1rem 2rem 0;font-size:13px;color:var(--t3);}
.breadcrumb a{color:var(--t3);text-decoration:none;}
.breadcrumb a:hover{color:var(--grn);}
.header{padding:1.25rem 2rem 2rem;border-bottom:0.5px solid var(--bdr);display:flex;align-items:flex-start;gap:1.25rem;max-width:900px;margin:0 auto;}
.header-avatar{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,0.06);}
.header-info h1{font-size:24px;font-weight:700;margin-bottom:.4rem;}
.co-sector-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:8px;margin-right:8px;}
.header-loc{font-size:13px;color:var(--t3);margin-top:.5rem;display:flex;align-items:center;gap:5px;}
.header-actions{margin-top:1rem;display:flex;gap:10px;}
.section{padding:2rem;max-width:900px;margin:0 auto;border-bottom:0.5px solid var(--bdr);}
.section-title{font-size:16px;font-weight:600;margin-bottom:1rem;}
.about-text{font-size:14px;color:var(--t2);line-height:1.7;}
.about-source-note{font-size:11px;color:var(--t3);margin-top:.6rem;font-style:italic;}
.stats-row{display:flex;gap:12px;margin-bottom:1.5rem;}
.stat-card{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:1rem 1.25rem;flex:1;}
.stat-val{font-size:22px;font-weight:700;}
.stat-label{font-size:12px;color:var(--t3);margin-top:2px;}
.posting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:.9rem 0;border-bottom:0.5px solid var(--bdr);}
.posting-row:last-child{border-bottom:none;}
.posting-title{font-size:14px;font-weight:500;}
.posting-meta{font-size:12px;color:var(--t3);margin-top:2px;}
.posting-link{font-size:12px;color:var(--grn);text-decoration:none;white-space:nowrap;flex-shrink:0;}
.posting-link:hover{text-decoration:underline;}
.empty-note{font-size:13px;color:var(--t3);line-height:1.6;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.loc-tag{font-size:12px;color:var(--t2);background:var(--card2);border:0.5px solid var(--bdr2);border-radius:20px;padding:4px 11px;}
.loc-tag.remote{color:var(--grn);border-color:rgba(34,224,154,0.3);background:rgba(34,224,154,0.08);}
.loc-group-label{font-size:11px;color:var(--t3);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin:1rem 0 .5rem;}
.loc-group-label:first-child{margin-top:0;}
.posting-group-label{font-size:13px;font-weight:600;margin:1.5rem 0 .5rem;}
.posting-group-label:first-child{margin-top:0;}
.remote-badge{font-size:10px;font-weight:600;color:var(--grn);background:rgba(34,224,154,0.1);border:0.5px solid rgba(34,224,154,0.3);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap;}
footer{border-top:0.5px solid var(--bdr);padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;font-size:12px;color:var(--t3);}
footer a{color:var(--t3);text-decoration:none;}
footer a:hover{color:var(--grn);}
.footer-links{display:flex;gap:1.25rem;flex-wrap:wrap;}

@media (max-width:1200px){
  .nav{padding:1rem 1.25rem;}
  .nav-groups{gap:0;}
  .nav-group + .nav-group{margin-left:10px;padding-left:10px;}
  .nav-links{gap:.7rem;}
  .nav-right{gap:6px;}
  .nav-right .btn{padding:7px 12px;}
  #signinToggle{padding:7px 10px;}
}

@media (max-width:940px){
  .nav-toggle{display:flex;}
  .logo-img{height:64px;}
  .nav-groups{display:none;flex-direction:column;align-items:flex-start;gap:0;position:absolute;top:100%;left:0;right:0;background:var(--blk);border-bottom:0.5px solid var(--bdr);padding:1rem 1.5rem 1.25rem;z-index:50;}
  .nav-groups.open{display:flex;}
  .nav-group{width:100%;padding-top:.85rem;margin-top:.85rem;border-top:0.5px solid var(--bdr2);}
  .nav-group:first-child{padding-top:0;margin-top:0;border-top:none;}
  .nav-group + .nav-group{margin-left:0;padding-left:0;border-left:none;}
  .nav-links{flex-direction:column;align-items:flex-start;gap:.7rem;margin-top:.5rem;}
  .nav{padding:1rem 1rem;}
  .nav-right{gap:6px;}
  .nav-right .btn{padding:6px 9px;font-size:11px;}
}
</style>

<script>
const SECTOR_COLORS = {
  "Solar": "grn", "Wind": "blu", "Storage": "amb", "Grid": "pur", "EV": "cor",
  "Hydrogen": "blu", "Policy": "cor", "Sustainability": "grn",
};
const NEUTRAL_COLOR = "t3";

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function colorVar(key) {
  return key === "t3" ? "var(--t3)" : `var(--${key})`;
}
function fmtDate(raw) {
  // Some sources (e.g. Workday) give a relative string like "Posted 13 Days Ago"
  // instead of an ISO date - strip any leading "Posted " so the caller's own
  // "Posted " prefix doesn't end up doubled.
  if (!raw) return "date unknown";
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
    const d = new Date(raw);
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }
  }
  return raw.replace(/^posted\s+/i, "");
}

function renderNotFound(name) {
  document.getElementById("content").innerHTML = `
    <div class="section" style="border-bottom:none;">
      <div class="section-title">Company not found</div>
      <div class="empty-note">We don't have a record for "${escapeHtml(name || "")}". <a href="companies.html" style="color:var(--grn);">Browse all companies →</a></div>
    </div>`;
}

function postingRowHtml(p) {
  return `
    <div class="posting-row">
      <div>
        <div class="posting-title">${escapeHtml(p.job_title || "Untitled role")}${p.is_remote ? '<span class="remote-badge">REMOTE</span>' : ""}</div>
        <div class="posting-meta">${escapeHtml(p.location || "Location not listed")} · Posted ${fmtDate(p.date_posted)}</div>
      </div>
      ${p.job_url ? `<a class="posting-link" href="${p.job_url}" target="_blank" rel="noopener">View &amp; apply →</a>` : ""}
    </div>`;
}

function renderCompany(c) {
  const color = SECTOR_COLORS[c.sector_bucket] || NEUTRAL_COLOR;
  const initial = (c.name || "?").charAt(0).toUpperCase();

  const usPostings = c.sample_postings.filter(p => p.region === "US");
  const intlPostings = c.sample_postings.filter(p => p.region === "International");
  const otherPostings = c.sample_postings.filter(p => p.region !== "US" && p.region !== "International");

  const postingsHtml = c.sample_postings.length
    ? [
        usPostings.length ? `<div class="posting-group-label">U.S. postings (${usPostings.length})</div>${usPostings.map(postingRowHtml).join("")}` : "",
        intlPostings.length ? `<div class="posting-group-label">International postings (${intlPostings.length})</div>${intlPostings.map(postingRowHtml).join("")}` : "",
        otherPostings.length ? `<div class="posting-group-label">Other postings (${otherPostings.length})</div>${otherPostings.map(postingRowHtml).join("")}` : "",
      ].join("")
    : `<div class="empty-note">We're not currently tracking any open postings from ${escapeHtml(c.name)}.${c.career_url ? ` <a href="${c.career_url}" target="_blank" rel="noopener" style="color:var(--grn);">Check their careers page directly →</a>` : ""}</div>`;

  const usLocs = c.locations.us || [];
  const intlLocs = c.locations.international || [];
  const totalLocs = usLocs.length + intlLocs.length;
  const locsHtml = (totalLocs || c.has_remote_postings)
    ? [
        usLocs.length ? `<div class="loc-group-label">U.S.</div><div class="tag-row">${usLocs.map(l => `<span class="loc-tag">${escapeHtml(l)}</span>`).join("")}</div>` : "",
        intlLocs.length ? `<div class="loc-group-label">International</div><div class="tag-row">${intlLocs.map(l => `<span class="loc-tag">${escapeHtml(l)}</span>`).join("")}</div>` : "",
        c.has_remote_postings ? `<div class="loc-group-label">Remote</div><div class="tag-row"><span class="loc-tag remote">Remote roles available</span></div>` : "",
      ].join("")
    : `<div class="empty-note">No locations tracked yet for this employer.</div>`;

  const headerLocParts = usLocs.slice(0, 2).concat(intlLocs.slice(0, 1));
  if (c.has_remote_postings) headerLocParts.push("Remote");
  const headerLoc = headerLocParts.length ? headerLocParts.join(" · ") : "Locations not tracked yet";

  document.getElementById("content").innerHTML = `
    <div class="header">
      <div class="header-avatar" style="color:${colorVar(color)};">${initial}</div>
      <div class="header-info">
        <h1>${escapeHtml(c.name)}</h1>
        <span class="co-sector-badge" style="background:${colorVar(color)}22;color:${colorVar(color)};">${escapeHtml(c.sector || "Uncategorized")}</span>
        <div class="header-loc"><i class="ti ti-map-pin" style="font-size:13px;"></i>${escapeHtml(headerLoc)}</div>
        <div class="header-actions">
          ${c.open_postings_count ? `<a href="jobs.html?company=${encodeURIComponent(c.name)}" style="text-decoration:none;"><button class="btn btn-grn">See open roles on Verde Talent →</button></a>` : ""}
        </div>
      </div>
    </div>
    <div class="section">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" style="color:var(--grn);">${c.open_postings_count}</div><div class="stat-label">Open postings tracked</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--blu);">${totalLocs}</div><div class="stat-label">Locations tracked</div></div>
        ${c.employee_count ? `<div class="stat-card"><div class="stat-val" style="color:var(--amb);">${c.employee_count_source === "estimated" ? "~" : ""}${c.employee_count.toLocaleString()}</div><div class="stat-label">Employees${c.is_public ? " (public co.)" : ""}${c.employee_count_source === "estimated" ? ` <span title="${escapeHtml(c.employee_count_note || "Estimated from public sources")}" style="cursor:help;text-decoration:underline dotted;">(estimated)</span>` : ""}</div></div>` : ""}
      </div>
      <div class="section-title">About</div>
      ${c.about_snippet
        ? `<div class="about-text">${escapeHtml(c.about_snippet)}</div><div class="about-source-note">${
            c.about_source === "wikipedia"
              ? `Via <a href="${c.about_source_url}" target="_blank" rel="noopener" style="color:var(--t3);">Wikipedia</a>.`
              : `From ${escapeHtml(c.name)}'s own job postings.`
          }</div>`
        : `<div class="empty-note">No company description available yet.</div>`}
    </div>
    <div class="section">
      <div class="section-title">Locations we're tracking</div>
      ${locsHtml}
    </div>
    <div class="section" style="border-bottom:none;">
      <div class="section-title">Open postings</div>
      ${postingsHtml}
    </div>`;
}

(function main() {
  const dataEl = document.getElementById("companies-data");
  const companies = JSON.parse(dataEl.textContent);
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name");
  const match = companies.find(c => c.name === name);
  if (match) {
    document.title = `${match.name} — Verde Talent`;
    renderCompany(match);
  } else {
    renderNotFound(name);
  }
})();
</script>
