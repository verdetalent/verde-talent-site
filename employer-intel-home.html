/* Intelligence home. Built on the roles and markets an account FOLLOWS, not on the jobs it
   has posted: plenty of Intelligence customers never post a job with us, and for them a
   page organised around postings is empty. Postings, where they exist, pre-fill the

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);

  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;}

.logo-img{height:104px;width:auto;display:block;}
.nav-right{display:flex;gap:20px;align-items:center;font-size:13px;flex-wrap:wrap;}
.nav-right a{color:var(--t2);text-decoration:none;}
.nav-right a:hover{color:var(--grn);}
.nav-right a.here{color:var(--t1);font-weight:600;}
.wrap{max-width:1180px;margin:0 auto;padding:2.2rem 1.5rem 4rem;}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:1.4rem;}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.02em;}
.hero p{font-size:13.5px;color:var(--t2);margin-top:6px;line-height:1.6;max-width:70ch;}
.hero p b{color:var(--t1);font-weight:600;}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border-radius:10px;font-size:13px;font-weight:600;padding:9px 14px;text-decoration:none;
display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);cursor:pointer;border:0;}
.btn.blu{background:var(--blu);color:#04202f;}
.btn.ghost{background:transparent;color:var(--t1);border:0.5px solid var(--bdr2);}
.btn.ghost:hover{border-color:rgba(79,179,255,.5);color:var(--blu);}
.btn:disabled{opacity:.4;cursor:default;}

.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);

.section-title em{font-style:normal;text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;}

<script>
// Every figure comes from Supabase behind the subscriber check and what the account follows
// is intel_watchlist - both through intel-data.js. Nothing paid is in this page or on this
// site; without Intelligence the dataset request returns no rows and the locked view shows.
let D = null;
// 'data' (follows roles, no postings), 'postings' (has live postings), 'locked'; a local
// sample can also be 'new' (first visit).
let MODE = 'data';
let POSTINGS = [];
let WATCH = null;
const el = id => document.getElementById(id);
const money = v => v == null ? '&mdash;' : '$' + Math.round(v).toLocaleString();
const gw = v => v >= 1000 ? (v / 1000).toFixed(1) + ' GW' : Math.round(v) + ' MW';
const plural = (n, one, many) => n === 1 ? one : many;
const link = (role, st) => `employer-intelligence.html?role=${encodeURIComponent(role)}&state=${st}`;
// Local sample only: what a data-only customer might follow after setup. Pairs chosen
// because each has published pay and a BLS range, so the sample shows the page working.
const SAMPLE_WATCH = [['Wind turbine technician', 'TX'], ['Wind turbine technician', 'CO'],
  ['Solar O&M technician', 'CA'], ['Solar O&M technician', 'TX'], ['Solar O&M technician', 'NV'],
  ['Project manager', 'CA'], ['Project manager', 'MA']];

const mode = () => MODE;
const cellOf = (role, st) => ((D.states[st] || {}).roles || {})[role] || null;
const title = role => D.titles[role] || role;

// A copy: callers edit what they get back, and saveWatch diffs it against WATCH.
function loadWatch(){ return WATCH ? WATCH.map(r => ({ ...r })) : null; }
function saveWatch(rows){
  const before = WATCH;
  WATCH = rows.map(r => ({ role: r.role, state: r.state }));
  VTIntel.watch.save(before, WATCH);
}

// The watchlist is the spine. Postings, when an account has them, only add pairs to it.
function watchlist(){
  const m = mode();
  let rows = loadWatch();
  if (!rows && m === 'data' && VTIntel.SAMPLE) rows = SAMPLE_WATCH.map(([role, state]) => ({ role, state }));
  rows = (rows || []).map(r => ({ ...r }));
  if (m === 'postings') POSTINGS.forEach(p => rows.push({ role: p.role, state: p.state, fromPosting: true }));
  const seen = new Set();
  return rows.filter(r => { const k = r.role + '|' + r.state; if (seen.has(k) || !cellOf(r.role, r.state)) return false; seen.add(k); return true; });
}

function bandChip(c){
  const pay = c.pay, bls = c.bls;
  if (!pay) return '<span class="chip no">too few advertise pay</span>';
  if (!bls || !bls[3]) return '<span class="chip no">no BLS range</span>';
  if (pay[1] < bls[3]) return '<span class="chip lo">below BLS 25th</span>';
  if (pay[1] > bls[4]) return '<span class="chip hi">above BLS 75th</span>';
  return '<span class="chip mid">within BLS range</span>';
}
// BLS pay for a role in a state: [median, p25, p75, employment], or null where BLS does
// not publish. Independent of whether we hold any postings there.
// Advertised pay below the 5-postings-from-3-employers bar is an early read: shown, but
// with its sample, so a figure built on two postings never reads like one built on forty.
const early = c => c && c.pay && c.pay[5] === 'early';
const advertised = c => !c || !c.pay ? '<span class="muted">&mdash;</span>'
  : money(c.pay[1]) + (early(c) ? `<div class="where">early read &middot; ${c.pay[4]} from ${c.pay[3]}</div>` : '');
const blsOf = (role, st) => ((D.bls || {})[role] || { states: {} }).states[st] || null;

// ---------------------------------------------------------------- findings -------------
// Plain statements the data supports for THIS watchlist, ranked and capped at five. Each
// one names the role and market it is about and links to it. Nothing here needs postings.
function findings(rows){
  const out = [];
  const statesSeen = new Set();
  rows.forEach(r => {
    const c = cellOf(r.role, r.state), st = D.states[r.state], nat = D.national[r.role] || {};
    const name = st.name, t = title(r.role);
    if (c.pay && c.bls && c.bls[3] && c.pay[1] < c.bls[3])
      out.push([90, 'warn', 'Pay', `Employers advertise <b>${t}s</b> in ${name} at ${money(c.pay[1])} &mdash; below the
        BLS 25th percentile of ${money(c.bls[3])} for people already doing the job.`, r]);
    if (c.days && nat.days && c.days >= nat.days * 1.5)
      out.push([66, 'warn', 'Time to fill', `<b>${t}</b> searches in ${name} take <b>${c.days} days</b> to fill, against
        ${nat.days} nationally.`, r]);
    const top = (c.emp || [])[0];
    if (top && c.open >= 8 && top[1] / c.open >= 0.4)
      out.push([56, '', 'Competition', `<b>${top[0]}</b> accounts for ${top[1]} of the ${c.open} open ${t} roles
        in ${name}.`, r]);
    const cert = ((c.sig || {}).certs || [])[0];
    if (cert && cert[1] >= 40)
      out.push([48, '', 'Requirements', `<b>${cert[1]}%</b> of ${t} postings in ${name} require <b>${cert[0]}</b>.`, r]);
    if (!statesSeen.has(r.state) && st.pipe && st.pipe.mw.within_12mo >= 3000){
      statesSeen.add(r.state);
      const dev = (st.pipe.top_developers || [])[0];
      out.push([70, 'good', 'Demand ahead', `<b>${gw(st.pipe.mw.within_12mo)}</b> is due online in ${name} in the next
        12 months${dev ? `, led by ${dev.entity.trim()}` : ''} &mdash; a hiring wave for anyone staffing sites there.`, r]);
    }
  });
  const seen = new Set();
  return out.sort((a, b) => b[0] - a[0]).filter(f => { const k = f[2] + f[4].role + f[4].state; return seen.has(k) ? false : seen.add(k); }).slice(0, 5);
}

function rivals(rows){
  const tally = {};
  rows.forEach(r => (cellOf(r.role, r.state).emp || []).forEach(([name, open, , delta]) => {
    const t = tally[name] || (tally[name] = { open: 0, markets: new Set(), deltas: [] });
    t.open += open; t.markets.add(r.state); if (delta != null) t.deltas.push(delta);
  }));
  const list = Object.entries(tally).sort((a, b) => b[1].open - a[1].open).slice(0, 8);
  if (!list.length) return '<p class="muted">No employers hiring these roles in your markets right now.</p>';
  return list.map(([name, t]) => {
    const avg = t.deltas.length ? Math.round(t.deltas.reduce((a, b) => a + b, 0) / t.deltas.length) : null;
    const chip = avg == null ? '<span class="chip no">no pay stated</span>'
      : avg >= 3 ? `<span class="chip up">+${avg}%</span>` : avg <= -3 ? `<span class="chip dn">${avg}%</span>` : '<span class="chip eq">at market</span>';
    const v = (D.velocity || {})[name];
    return `<div class="erow"><div>${name}${v == null ? '' : `<div class="trend ${v > 0 ? 'up' : v < 0 ? 'dn' : ''}">${v > 0 ? '+' : ''}${v}% hiring</div>`}</div>
      <u>${t.open} open &middot; ${t.markets.size} ${plural(t.markets.size, 'market', 'markets')}</u>${chip}</div>`;
  }).join('');
}

// Only for accounts with postings, and after the market view - a module, not the spine.
function postingsSection(posts){
  const rows = posts.map(p => {
    const c = cellOf(p.role, p.state), market = c && c.pay ? c.pay[1] : null;
    const delta = market ? Math.round(100 * (p.advertised / market - 1)) : null;
    const sig = c && c.sig, missing = sig && p.requirements && (sig.certs || []).find(([n, req]) => req >= 25 && !p.requirements.certs.includes(n));
    return { p, c, market, delta, missing };
  });
  const chip = d => d == null ? '<span class="chip no">no benchmark yet</span>'
    : d >= 3 ? `<span class="chip up">+${d}%</span>` : d <= -3 ? `<span class="chip dn">${d}%</span>` : '<span class="chip eq">at market</span>';
  return `<div class="section-title"><span>Your live postings against their markets</span><em>because you post with us</em></div>
  <div class="panel" style="padding:.4rem 1.1rem;"><table>

    <tbody>${rows.map(({ p, c, market, delta, missing }) => `<tr class="link" data-href="${link(p.role, p.state)}">
      <td><div class="role">${p.title}</div><div class="where">${D.states[p.where] ? D.states[p.where].name : p.where}</div>
        ${missing ? `<div class="gapnote">${missing[1]}% here require ${missing[0]}, you don't ask</div>` : ''}</td>
      <td class="n">${money(p.advertised)}</td><td class="n">${market ? money(market) : '&mdash;'}</td>
      <td class="n">${chip(delta)}</td>
      <td class="n hide-sm">${p.days}${c && c.days ? `<div class="where">typical ${c.days}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

// ---------------------------------------------------------------- setup ----------------
// Two questions for everyone. An account that posts with us gets its posted roles and
// markets ticked already; it can untick them.
function renderSetup(existing){
  const pre = existing && existing.length ? existing
    : (mode() === 'postings' ? POSTINGS.map(p => ({ role: p.role, state: p.state })) : []);
  const roles = Object.entries(D.national).sort((a, b) => b[1].open - a[1].open).slice(0, 18).map(([r]) => r);
  pre.forEach(r => { if (!roles.includes(r.role)) roles.push(r.role); });
  const markets = Object.entries(D.states).map(([k, v]) => [k, v.name, Object.values(v.roles).reduce((n, c) => n + c.open, 0)])
    .sort((a, b) => b[2] - a[2]).slice(0, 16);
  pre.forEach(r => { if (!markets.some(mk => mk[0] === r.state) && D.states[r.state]) markets.push([r.state, D.states[r.state].name, 0]); });
  const picked = { roles: new Set(pre.map(r => r.role)), markets: new Set(pre.map(r => r.state)) };

  PANE.innerHTML = `<div class="setup">
    <h2>Which roles and markets do you want to follow?</h2>
    <p class="lead">They will be tracked here: pay, who is hiring, how long roles stay open and what stands out.
      Change them any time; everything else stays open to explore.</p>
    <div class="step">Roles</div>
    <div class="picks">${roles.map(r => `<button class="pick" type="button" data-kind="roles" data-value="${r}"
      aria-pressed="${picked.roles.has(r)}">${title(r)}</button>`).join('')}</div>
    <div class="step">Markets</div>
    <div class="picks">${markets.map(([k, name]) => `<button class="pick" type="button" data-kind="markets" data-value="${k}"
      aria-pressed="${picked.markets.has(k)}">${name}</button>`).join('')}</div>
    <div class="actions"><button class="btn blu" id="setupDone">Save</button><span class="count" id="setupCount"></span></div>
  </div>`;
  const count = () => {
    const ready = picked.roles.size && picked.markets.size;
    el('setupDone').disabled = !ready;
    el('setupCount').textContent = ready ? `${picked.roles.size} ${plural(picked.roles.size, 'role', 'roles')} in
      ${picked.markets.size} ${plural(picked.markets.size, 'market', 'markets')}` : 'Pick at least one of each.';
  };
  PANE.querySelectorAll('.pick').forEach(b => b.onclick = () => {
    const set = picked[b.dataset.kind], on = b.getAttribute('aria-pressed') === 'true';
    on ? set.delete(b.dataset.value) : set.add(b.dataset.value);
    b.setAttribute('aria-pressed', String(!on)); count();
  });
  count();
  el('setupDone').onclick = () => {
    const rows = [];
    picked.roles.forEach(role => picked.markets.forEach(state => { if (cellOf(role, state)) rows.push({ role, state }); }));
    saveWatch(rows);
    renderMine();
  };
}

const defaultLayer = () => EX.role ? 'bls' : EX.sector === 'Grid' ? 'sind' : EX.sector ? 'sworkforce' : 'workforce';

function values(){
  const L = LAYERS[EX.layer], out = {};
  Object.entries(D.states).forEach(([k, st]) => {
    const c = EX.role ? (st.roles || {})[EX.role] : null;
    const v = L.get(st, c, k);
    if (v !== null && v !== undefined && !(typeof v === 'number' && isNaN(v))) out[k] = v;
  });
  return out;
}

// Colour by rank rather than by value, so one giant (California's workforce is 2.5x the
// next state) does not wash every other state into the same shade.
function colours(vals){
  const L = LAYERS[EX.layer], out = {};
  const bands = (keys, ramp) => {
    const sorted = keys.slice().sort((a, b) => vals[a] - vals[b]);
    sorted.forEach((k, i) => { out[k] = ramp[Math.min(ramp.length - 1, Math.floor(i * ramp.length / sorted.length))]; });
  };
  if (L.diverging){
    bands(Object.keys(vals).filter(k => vals[k] > 0), POS);
    const neg = Object.keys(vals).filter(k => vals[k] < 0);
    const sorted = neg.slice().sort((a, b) => vals[b] - vals[a]);
    sorted.forEach((k, i) => { out[k] = NEG[Math.min(NEG.length - 1, Math.floor(i * NEG.length / sorted.length))]; });
  } else bands(Object.keys(vals), RAMP);
  return out;
}
const lightBg = col => ['#c1852f', '#F5B041', '#22E09A'].includes(col);

function sectorBar(){
  return `<div class="sectors" role="group" aria-label="Sector">${['', ...Object.keys(SECTOR_LABEL)].map(s =>
    `<button class="sector" data-s="${s}" aria-pressed="${s === EX.sector}">${s ? SECTOR_LABEL[s] : 'All sectors'}</button>`).join('')}</div>`;
}

// The sector's own national picture, then the roles its employers are hiring - which is
// also where a role is picked, ranked by how much of that hiring it is.
function sectorSummary(){
  if (!EX.sector) return '<p class="hint">Pick a sector to see its own market, then the roles inside it.</p>';
  const n = secNat(), p = n.pipe, top = n.emp[0];
  const roles = n.roles.filter(([r]) => D.national[r]);
  const shown = EX.more ? roles.slice() : roles.slice(0, 10);
  if (EX.role && !shown.some(([r]) => r === EX.role)) shown.push(roles.find(([r]) => r === EX.role));
  return `<div class="secsum">
    <div class="secstats">
      <div><b>${n.workforce ? n.workforce.toLocaleString() : '&mdash;'}</b><span>${EX.sector === 'Grid' ? 'grid modernisation' : sw()} workers nationally</span></div>
      <div><b>${n.open.toLocaleString()}</b><span>open roles from ${n.nemp} ${sw()} employers we track</span></div>
      ${p ? `<div><b>${gw(p.mw12)}</b><span>due online in the next 12 months, of ${gw(p.mw)} planned in ${p.projects.toLocaleString()} projects</span></div>` : ''}
      ${top ? `<div><b>${top[0]}</b><span>hiring most: ${top[1]} open</span></div>` : ''}
    </div>
    <span class="rp-k">Roles ${sw()} employers are hiring &middot; open now</span>
    <div class="picks">
      <button class="rchip" data-r="" aria-pressed="${!EX.role}">All ${sw()} roles</button>
      ${shown.map(([r, c]) => `<button class="rchip" data-r="${r}" aria-pressed="${r === EX.role}">${title(r)}<i>${c}</i></button>`).join('')}
      ${roles.length > 10 ? `<button class="rchip more" id="rpMore">${EX.more ? 'Fewer' : `+${roles.length - 10} more`}</button>` : ''}
    </div></div>`;
}

// On the BLS layer, say where BLS is silent and send people to our own advertised pay.
// BLS leaves a state blank when too few people do the job there to publish, and some roles
// (project developer) have no BLS occupation at all - an empty map with no explanation
// reads as broken.
function blsGap(vals){
  if (EX.layer !== 'bls' || !EX.role) return '';
  const ours = Object.keys(D.states).filter(k => ((D.states[k].roles || {})[EX.role] || {}).pay);
  const blank = Object.keys(D.states).filter(k => !(k in vals));
  if (!blank.length) return '';
  const fills = ours.filter(k => !(k in vals));
  const btn = ours.length ? '<button class="btn blu" type="button" id="gapGo">Show advertised pay &rarr;</button>' : '';
  const t = title(EX.role);
  let msg;
  if (!Object.keys(vals).length)
    msg = `BLS does not publish pay for <b>${t}s</b>${D.bls[EX.role] ? ' in any state' : ' - there is no government occupation that matches this role'}. `
      + (ours.length ? `Check <b>Advertised pay (our postings)</b> for what employers on our site are offering: ${ours.length} ${plural(ours.length, 'state has', 'states have')} a figure.`
        : 'We do not yet have enough advertised pay to show a figure either; it builds as more employers post.');
  else if (fills.length)
    msg = `BLS leaves <b>${blank.length} ${plural(blank.length, 'state', 'states')}</b> blank for ${t}s because too few people do the job there to publish. `
      + `<b>Advertised pay (our postings)</b> has a figure for ${fills.length} of them.`;
  else
    msg = `BLS leaves <b>${blank.length} ${plural(blank.length, 'state', 'states')}</b> blank for ${t}s because too few people do the job there to publish.`
      + (ours.length ? ' Check <b>Advertised pay (our postings)</b> for what employers on our site are offering.'
        : ' Advertised pay (our postings) does not have enough on-site data for this role yet either; it builds as more employers post.');
  return `<div class="gap"><span>${msg}</span>${btn}</div>`;
}

function renderExplore(){
  const pane = el('explore');
  if (!layerKeys().includes(EX.layer)) EX.layer = defaultLayer();
  const L = LAYERS[EX.layer], vals = values(), cols = colours(vals);
  const ranked = Object.keys(vals).sort((a, b) => vals[b] - vals[a]);
  if (!EX.sel || !D.states[EX.sel]) EX.sel = ranked[0] || 'TX';

  pane.innerHTML = `${sectorBar()}${sectorSummary()}
    <div class="layers">${layerKeys().map(k => `<button class="layer" data-k="${k}"
      aria-pressed="${k === EX.layer}">${txt(LAYERS[k].label)}</button>`).join('')}</div>
    ${blsGap(vals)}
    <div class="mapwrap">
      <div>
        <div class="map">${GRID.flat().map(k => {
          if (!k) return '<div class="tile blank"></div>';
          const has = k in vals, bg = cols[k];
          const faded = EX.layer === 'pay' && early(((D.states[k] || {}).roles || {})[EX.role]);
          return `<div class="tile ${has ? '' : 'none'} ${k === EX.sel ? 'sel' : ''}" data-st="${k}"
            style="${has ? `background:${bg};color:${lightBg(bg) ? '#1d1407' : '#fff'}${faded ? ';opacity:.55' : ''}` : ''}">${k}
            <span>${has ? L.fmt(vals[k]) : '&mdash;'}</span></div>`;
        }).join('')}</div>
        <div class="legend">${L.diverging
          ? `<span>more leaving</span>${NEG.slice().reverse().map(c => `<i style="background:${c}"></i>`).join('')}${POS.map(c => `<i style="background:${c}"></i>`).join('')}<span>more arriving</span>`
          : `<span>lower</span>${RAMP.map(c => `<i style="background:${c}"></i>`).join('')}<span>higher</span>`}
          <span style="margin-left:6px;">&middot; &mdash; means no published figure${EX.layer === 'pay'
            ? ' &middot; faded tiles are early reads, from fewer than 5 postings or 3 employers' : ''}</span></div>
        <p class="mapnote">${txt(L.note)}${EX.role ? ` Showing <b>${title(EX.role)}</b>.` : ''}${
          EX.layer === 'bls' && D.bls[EX.role] && D.bls[EX.role].broad
            ? ' BLS has no occupation this narrow, so this is the wider occupation the role sits in.' : ''}</p>
      </div>
      <div class="side">${nationalFacts()}</div>
    </div>
    <div class="statepanel" id="statePanel"></div>`;

  pane.querySelectorAll('.sector').forEach(b => b.onclick = () => {
    EX.sector = b.dataset.s; EX.role = ''; EX.more = false; EX.layer = defaultLayer(); renderExplore();
  });
  pane.querySelectorAll('.rchip[data-r]').forEach(b => b.onclick = () => {
    EX.role = b.dataset.r; EX.layer = defaultLayer(); renderExplore();
  });
  if (el('rpMore')) el('rpMore').onclick = () => { EX.more = !EX.more; renderExplore(); };
  pane.querySelectorAll('.layer').forEach(b => b.onclick = () => { EX.layer = b.dataset.k; renderExplore(); });
  if (el('gapGo')) el('gapGo').onclick = () => { EX.layer = 'pay'; renderExplore(); };
  pane.querySelectorAll('.tile[data-st]').forEach(t => t.onclick = () => {
    EX.sel = t.dataset.st; renderExplore();
    el('statePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  pane.querySelectorAll('.nf[data-st]').forEach(n => n.onclick = () => { EX.sel = n.dataset.st; renderExplore(); });
  renderStatePanel(EX.sel);
}

// Three national facts beside the map. Each is clickable and selects its state.
function nationalFacts(){
  const top = (get, dir = 1) => Object.entries(D.states).map(([k, st]) => [k, st, get(st, k)])
    .filter(([, , v]) => v != null && !isNaN(v)).sort((a, b) => dir * (b[2] - a[2]))[0];
  const card = (label, hit, text) => hit ? `<div class="nf" data-st="${hit[0]}"><span class="k">${label}</span>
    <b>${hit[1].name}</b><p>${text(hit)}</p></div>` : '';
  if (!EX.role && !EX.sector){
    return card('Largest workforce', top(st => st.workforce), h => `${h[2].toLocaleString()} people in clean energy.`)
      + card('Most capacity coming', top(st => st.pipe && st.pipe.mw.within_12mo), h => `${gw(h[2])} due online within 12 months.`)
      + card('Most people moving in', top(st => st.move && st.move.net_households), h => `${h[2].toLocaleString()} more households arrived than left.`);
  }
  if (!EX.role){
    const a = k => secArea(k) || {};
    return card(`Largest ${sw()} workforce`, top((st, k) => a(k).workforce),
        h => `${h[2].toLocaleString()} people in ${EX.sector === 'Grid' ? 'grid modernisation' : sw()}.`)
      + (EX.sector === 'Grid'
        ? card('Most concentrated', top((st, k) => a(k).ind && a(k).ind.lq), h => `Grid industry jobs are ${h[2].toFixed(1)}&times; the national share.`)
        : card(`Most ${sw()} coming`, top((st, k) => a(k).pipe && a(k).pipe.mw12), h => `${gw(h[2])} due online within 12 months.`))
      + card(`Most open ${sw()} roles`, top((st, k) => a(k).open || null), h => `${h[2]} open, from ${a(h[0]).nemp} employers.`);
  }
  const c = st => (st.roles || {})[EX.role];
  return card('Highest pay (BLS)', top((st, k) => blsOf(EX.role, k) ? blsOf(EX.role, k)[0] : null),
      h => `Median ${money(h[2])} for people doing the job.`)
    + (EX.sector
      ? card('Most open roles', top((st, k) => secRoleOpen(k, EX.role)), h => `${h[2]} open with ${sw()} employers.`)
      : card('Most open roles', top(st => c(st) ? c(st).open : null), h => `${h[2]} open, from ${c(h[1]).nemp} employers.`))
    + card('Slowest to fill', top(st => c(st) && c(st).days ? c(st).days : null), h => `Searches take ${h[2]} days to fill.`);
}

function followRows(){
  const stored = loadWatch();
  if (stored) return stored;
  return mode() === 'data' && VTIntel.SAMPLE ? SAMPLE_WATCH.map(([role, state]) => ({ role, state })) : [];
}
const isFollowed = (role, st) => watchlist().some(r => r.role === role && r.state === st);
function toggleFollow(role, st){
  let rows = followRows();
  const i = rows.findIndex(r => r.role === role && r.state === st);
  i >= 0 ? rows.splice(i, 1) : rows.push({ role, state: st });
  saveWatch(rows);
  renderMine();
}

function stateStats(st, sa){
  const mv = st.move;
  if (!sa) return `
      <div><b>${st.workforce ? st.workforce.toLocaleString() : '&mdash;'}</b><span>clean energy workers</span></div>
      <div><b>${openAll(st).toLocaleString()}</b><span>open roles we track</span></div>
      <div><b>${st.pipe && st.pipe.mw.within_12mo ? gw(st.pipe.mw.within_12mo) : '&mdash;'}</b><span>due online in 12 months</span></div>
      <div><b>${st.unemp ? st.unemp.latest + '%' : '&mdash;'}</b><span>unemployment</span></div>
      <div><b>${mv ? signedK(mv.net_households) : '&mdash;'}</b><span>net households moving in</span></div>
      <div><b>${st.train && st.train.total ? st.train.total.toLocaleString() : '&mdash;'}</b><span>trained in the trades last year</span></div>`;
  const i = sa.ind || {}, p = sa.pipe;
  // USEER counts everyone doing the sector's work (installers, manufacturers, developers);
  // QCEW counts only companies classed in its NAICS codes. Different questions, so they are
  // labelled as such. QCEW's average wage is left out: it includes head-office staff and
  // reads as a pay figure it is not.
  return `
      <div><b>${sa.workforce ? sa.workforce.toLocaleString() : '&mdash;'}</b><span>people in ${EX.sector === 'Grid' ? 'grid modernisation' : sw() + ' work'} (DOE)</span></div>
      <div><b>${sa.open.toLocaleString()}</b><span>open ${sw()} roles &middot; ${sa.nemp} ${plural(sa.nemp, 'employer', 'employers')}</span></div>
      ${EX.sector === 'Grid'
        ? `<div><b>${st.train && st.train.total ? st.train.total.toLocaleString() : '&mdash;'}</b><span>trained in the trades last year</span></div>`
        : `<div><b>${p && p.mw12 ? gw(p.mw12) : '&mdash;'}</b><span>due online in 12 months${p ? ` &middot; ${p.projects} projects planned` : ''}</span></div>`}
      <div><b>${i.emp ? i.emp.toLocaleString() : '&mdash;'}</b><span>employed by ${INDUSTRY_SHORT[EX.sector]} companies (QCEW)</span></div>
      <div><b>${i.lq ? i.lq.toFixed(1) + '&times;' : '&mdash;'}</b><span>as concentrated as nationally</span></div>
      <div><b>${st.unemp ? st.unemp.latest + '%' : '&mdash;'}</b><span>unemployment, all industries</span></div>`;
}

function renderStatePanel(k){
  const st = D.states[k], box = el('statePanel');
  if (!st){ box.innerHTML = ''; return; }
  const sa = secArea(k);
  // [role, cell, open]: with a sector, only its employers' postings count towards open.
  let roleRows = sa ? sa.roles.filter(([r]) => (st.roles || {})[r]).map(([r, n]) => [r, st.roles[r], n])
    : Object.entries(st.roles || {}).map(([r, c]) => [r, c, c.open]);
  roleRows = roleRows.sort((a, b) => {
    if (EX.role && a[0] === EX.role) return -1;
    if (EX.role && b[0] === EX.role) return 1;
    return b[2] - a[2];
  }).slice(0, 8);
  let employers;
  if (sa) employers = sa.emp;
  else {
    const tally = {};
    Object.values(st.roles || {}).forEach(c => (c.emp || []).forEach(([name, open]) => { tally[name] = (tally[name] || 0) + open; }));
    employers = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }
  const ind = (st.industry || [])[0];
  const mv = st.move;
  const builders = sa && sa.pipe ? sa.pipe.dev : [];
  const sub = sa
    ? (sa.ind && sa.ind.lq ? `${SECTOR_LABEL[EX.sector]} industry jobs are ${sa.ind.lq.toFixed(1)}&times; as concentrated here as nationally` : `${SECTOR_LABEL[EX.sector]} in ${st.name}`)
    : (ind ? `${ind.title} is ${ind.lq.toFixed(1)}&times; as concentrated here as nationally` : '');

  box.innerHTML = `
    <div class="statehead"><div><h2>${st.name}${EX.sector ? ` <span class="muted" style="font-weight:500;">&middot; ${SECTOR_LABEL[EX.sector]}</span>` : ''}</h2>
      <p>${sub}</p></div>
      ${EX.role && (st.roles || {})[EX.role] ? `<a class="btn blu" href="${link(EX.role, k)}">Open ${title(EX.role)} in ${st.name} &rarr;</a>` : ''}</div>
    <div class="sstats">${stateStats(st, sa)}</div>
    <div class="two">
      <div class="panel" style="padding:.5rem 1.1rem;">
        <div class="section-title" style="margin:.6rem 0 .2rem;"><span>${sa ? `Roles ${sw()} employers are hiring here` : 'Roles hiring here'}</span><em>click for the full picture</em></div>
        ${roleRows.length ? `<table><thead><tr><th>Role</th><th class="n">Pay (BLS)</th><th class="n hide-sm">Advertised</th>
          <th class="n">Open</th><th></th></tr></thead><tbody>${roleRows.map(([role, c, open]) => `
          <tr class="link ${role === EX.role ? 'hl' : ''}" data-href="${link(role, k)}">
            <td><div class="role">${title(role)}</div><div class="where">${sa ? '' : `${c.nemp} ${plural(c.nemp, 'employer', 'employers')}${c.days ? ' &middot; ' : ''}`}${c.days ? `${c.days} days to fill` : ''}</div></td>
            <td class="n">${blsOf(role, k) ? money(blsOf(role, k)[0]) : '<span class="muted">&mdash;</span>'}</td>
            <td class="n hide-sm">${advertised(c)}</td><td class="n">${open}</td>
            <td class="n"><button class="follow ${isFollowed(role, k) ? 'on' : ''}" data-role="${role}">${isFollowed(role, k) ? 'Following' : '+ Follow'}</button></td>
          </tr>`).join('')}</tbody></table>`
          : `<p class="muted" style="padding:.8rem 0;">No ${sa ? sw() + ' ' : ''}roles open here right now. The figures above still describe the market.</p>`}
      </div>
      <div class="panel">
        <div class="section-title" style="margin:0 0 .4rem;"><span>${sa ? `${SECTOR_LABEL[EX.sector]} employers hiring here` : 'Who is hiring here'}</span><em>trend is national</em></div>
        ${employers.length ? employers.map(([name, open]) => { const v = (D.velocity || {})[name]; return `<div class="erow">
          <div>${name}${v == null ? '' : `<div class="trend ${v > 0 ? 'up' : v < 0 ? 'dn' : ''}">${v > 0 ? '+' : ''}${v}% hiring</div>`}</div>
          <u>${open} open</u><span></span></div>`; }).join('') : `<p class="muted">No ${sa ? sw() + ' ' : ''}employers hiring here right now.</p>`}
        ${builders.length ? `<div class="section-title" style="margin:1.2rem 0 .4rem;"><span>Building ${sw()} here</span><em>planned capacity</em></div>
          ${builders.map(([name, mw]) => `<div class="erow"><div>${name}</div><u>${gw(mw)}</u><span></span></div>`).join('')}` : ''}
        ${!sa && mv && mv.top_origins && mv.top_origins.length ? `<p class="note">Most arrivals came from ${mv.top_origins.slice(0, 3)
          .map(o => (D.states[o.state] || {}).name || o.state).join(', ')}.</p>` : ''}
      </div>
    </div>`;
  box.querySelectorAll('tr.link').forEach(tr => tr.onclick = e => {
    if (e.target.closest('.follow')) return;
    location.href = tr.dataset.href;
  });
  box.querySelectorAll('.follow').forEach(b => b.onclick = e => {
    e.stopPropagation();
    toggleFollow(b.dataset.role, k);
    const on = isFollowed(b.dataset.role, k);
    b.classList.toggle('on', on); b.textContent = on ? 'Following' : '+ Follow';
  });
}

// ================================================================ your markets ========
function renderMine(){
  PANE = el('mine');
  const rows = watchlist();
  if (!rows.length){
    PANE.innerHTML = `<div class="empty"><h2>You are not following anything yet</h2>
      <p>Follow the roles and markets you care about and they are tracked here: pay against the market, who is
        hiring, how long roles stay open, and anything that stands out. Use <b>+ Follow</b> on any state in Explore,
        or pick them all at once.</p>
      <button class="btn blu" id="pickNow">Choose what to follow</button></div>`;
    el('pickNow').onclick = () => renderSetup(null);
    return;
  }
  renderDashboard(rows);
}

const TAB_KEY = 'vt_intel_home_tab';
function showTab(name){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.pane === name)));
  document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.pane !== name; });
  try { localStorage.setItem(TAB_KEY, name); } catch {}
}

function start(){
  const m = mode();
  if (m === 'locked') return renderLocked();
  el('lede').innerHTML = 'Every clean energy market we track, rebuilt each morning. Start with the national picture, pick a sector, then narrow to a state or a role.';
  el('acts').innerHTML = '';
  el('content').innerHTML = `
    <div class="tabs" role="tablist">
      <button class="tab" data-pane="explore" role="tab">Explore<small>the national picture, then a sector, state or role</small></button>
      <button class="tab" data-pane="mine" role="tab">Your markets<small>the roles and markets you follow</small></button>
    </div>
    <div class="pane" data-pane="explore" id="explore"></div>
    <div class="pane" data-pane="mine" id="mine" hidden></div>`;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.pane));
  renderExplore();
  renderMine();
  // Explore first, always, on a first visit; after that, wherever they last were.
  let tab = 'explore';
  try { tab = localStorage.getItem(TAB_KEY) || 'explore'; } catch {}
  showTab(m === 'new' ? 'explore' : tab);
}

el('signOutLink').onclick = e => { e.preventDefault(); VTIntel.signOut(); };
if (VTIntel.SAMPLE){
  el('switcher').hidden = false;
  el('asSel').value = VTIntel.SAMPLE;
  el('asSel').onchange = () => { location.search = '?sample=' + el('asSel').value; };
}

(async () => {
  const got = await VTIntel.load();
  if (got.status === 'signin') return VTIntel.signIn('employer-intel-home.html');
  if (got.status === 'locked') { MODE = 'locked'; return renderLocked(); }
  D = got.data;
  POSTINGS = (await VTIntel.myPostings()).filter(p => D.states[p.state] && cellOf(p.role, p.state));
  WATCH = await VTIntel.watch.load();
  MODE = VTIntel.SAMPLE && VTIntel.SAMPLE !== 'postings' ? VTIntel.SAMPLE : (POSTINGS.length ? 'postings' : 'data');
  start();
})().catch(err => {
  console.error(err);
  el('content').innerHTML = '<p class="muted">Intelligence could not load just now. Refresh the page, or email contact@verdetalent.com if it keeps happening.</p>';
});
</script>
