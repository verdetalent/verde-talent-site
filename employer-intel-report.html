<style>
/* The monthly market report: one document covering the roles and markets an account
   follows. The same page is what the monthly email links to, and "Download PDF" is the
   browser's print-to-PDF with the print stylesheet at the bottom - generated on the
   subscriber's own machine from data they can already read, so no file is ever published. */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.62);--t3:rgba(255,255,255,0.38);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;}
.logo{display:flex;align-items:center;text-decoration:none;}
.logo-img{height:104px;width:auto;display:block;}
.nav-right{display:flex;gap:20px;align-items:center;font-size:13px;flex-wrap:wrap;}
.nav-right a{color:var(--t2);text-decoration:none;}
.nav-right a:hover{color:var(--grn);}
.nav-right a.here{color:var(--t1);font-weight:600;}
.wrap{max-width:980px;margin:0 auto;padding:2.2rem 1.5rem 4rem;}
.switcher{position:sticky;top:0;z-index:5;background:#1b1405;border-bottom:0.5px solid rgba(255,181,71,.3);
padding:.55rem 1.5rem;font-size:12px;color:var(--amb);}
.switcher[hidden]{display:none;}

.doc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:1.6rem;}
.doc-head .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grn);font-weight:700;}
.doc-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;}
.doc-head p{font-size:13.5px;color:var(--t2);margin-top:6px;line-height:1.6;}
.acts{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border-radius:10px;font-size:13px;font-weight:600;padding:9px 14px;text-decoration:none;display:inline-flex;
align-items:center;gap:6px;font-family:var(--font-sans);cursor:pointer;border:0;}
.btn.blu{background:var(--blu);color:#04202f;}
.btn.ghost{background:transparent;color:var(--t1);border:0.5px solid var(--bdr2);}

h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin:2.2rem 0 .8rem;}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.pulse div{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:1rem 1.1rem;}
.pulse b{display:block;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.pulse span{font-size:12px;color:var(--t3);line-height:1.4;display:block;margin-top:3px;}

/* Key takeaways: at most three, one per kind, each a number you can read at a glance. */
.takeaways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.take{background:var(--card);border:0.5px solid var(--bdr);border-top:3px solid var(--blu);border-radius:12px;padding:1rem 1.1rem;}
.take.warn{border-top-color:var(--amb);} .take.good{border-top-color:var(--grn);}
.take .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;}
.take b{display:block;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:.35rem 0 .2rem;font-variant-numeric:tabular-nums;}
.take p{font-size:13px;color:var(--t2);line-height:1.5;}
/* Flags: the smaller findings, shown on the market they are about. */
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:-.3rem 0 .9rem;}
.flag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(79,179,255,.1);color:var(--blu);}
.flag.warn{background:rgba(255,181,71,.12);color:var(--amb);}
/* Sectors two across, each marked with its colour. */
.sectors-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sectors-grid .market{margin-bottom:0;}
.sectors-grid.one{grid-template-columns:1fr;}
.sector{border-top:3px solid var(--c);}
.sector .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px;}
.sector .stats{grid-template-columns:1fr 1fr;}
a.deep{color:var(--blu);text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap;}
.market{background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:12px;}
.market-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:.9rem;}
.market-head h3{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.market-head a{font-size:12.5px;color:var(--blu);text-decoration:none;font-weight:600;}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem;}
.stats div{background:var(--card2);border-radius:10px;padding:.7rem .8rem;}
.stats b{display:block;font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;}
.stats span{font-size:11.5px;color:var(--t3);line-height:1.35;display:block;margin-top:2px;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cols h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);font-weight:600;margin-bottom:.5rem;}
.line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:0.5px solid var(--bdr);}
.line:last-child{border-bottom:0;}
.line u{text-decoration:none;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.band{margin:.2rem 0 1rem;font-size:13px;color:var(--t2);line-height:1.6;}
.band b{color:var(--t1);}
.muted{color:var(--t3);}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.chip.lo{color:var(--amb);background:rgba(255,181,71,0.1);}
.chip.hi{color:var(--grn);background:rgba(34,224,154,0.1);}
.chip.mid{color:var(--t2);background:rgba(255,255,255,0.06);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 8px;text-align:left;border-bottom:0.5px solid var(--bdr);}
thead th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:600;}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums;}
tbody tr:last-child td{border-bottom:0;}
.panel{background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;padding:.6rem 1.1rem;}
.empty{background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;padding:2rem;text-align:center;}
.empty h2{font-size:18px;color:var(--t1);text-transform:none;letter-spacing:0;margin:0 0 .5rem;}
.empty p{font-size:13.5px;color:var(--t2);line-height:1.65;max-width:56ch;margin:0 auto 1.2rem;}
.method{font-size:11.5px;color:var(--t3);line-height:1.65;margin-top:2.2rem;border-top:0.5px solid var(--bdr);padding-top:1rem;}
.print-only{display:none;}
footer{border-top:0.5px solid var(--bdr);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--t3);}
footer a{color:var(--t3);text-decoration:none;}
@media (max-width:760px){.pulse,.stats{grid-template-columns:1fr 1fr;}.cols{grid-template-columns:1fr;}.takeaways{grid-template-columns:1fr;}.sectors-grid{grid-template-columns:1fr;}}
@media (max-width:640px){.logo-img{height:56px;}.nav{flex-wrap:wrap;gap:8px;padding:.9rem 1rem;}.nav-right{gap:12px;font-size:12px;}
  .wrap{padding:1.6rem 1rem 3rem;}.doc-head h1{font-size:23px;}}

/* ---- Download PDF: a light, paper-shaped version of the same document. ---- */
@page{size:letter;margin:14mm 13mm;}
@media print{
  :root{--blk:#fff;--card:#fff;--card2:#F4F6F5;--bdr:#DADFDC;--bdr2:#C9CFCB;--t1:#111;--t2:#333;--t3:#6B716E;--grn:#0E8A5F;--blu:#1D6FB8;--amb:#A35F00;}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .nav,.switcher,.acts,footer,.market-head a,.screen-only{display:none !important;}
  .print-only{display:flex;}
  .wrap{max-width:none;padding:0;}
  .pulse div,.market,.take,.panel,.stats div{break-inside:avoid;}
  .flag{border:1px solid currentColor;}
  .market{border:1px solid var(--bdr);}
  .market.sector{border-top:3px solid var(--c);}
  h2{break-after:avoid;margin-top:1.4rem;}
  .brand{justify-content:space-between;align-items:center;border-bottom:2px solid #0E8A5F;padding-bottom:6px;margin-bottom:14px;font-size:11px;color:#6B716E;}
  .brand b{color:#0E8A5F;font-size:13px;letter-spacing:.02em;}
  .brand .bl{display:flex;align-items:center;gap:10px;}
  .brand img{height:100px;width:auto;display:block;margin:-10px 0 -8px -10px;}
}
</style>

<script>
let D = null;
const el = id => document.getElementById(id);
const money = v => v == null ? '&mdash;' : '$' + Math.round(v).toLocaleString();
const gw = v => v >= 1000 ? (v / 1000).toFixed(1) + ' GW' : Math.round(v) + ' MW';
const plural = (n, one, many) => n === 1 ? one : many;
const title = role => (D.titles || {})[role] || role;
const cellOf = (role, st) => ((D.states[st] || {}).roles || {})[role] || null;
const blsOf = (role, st) => ((D.bls || {})[role] || { states: {} }).states[st] || null;
const link = (role, st) => `employer-intelligence.html?role=${encodeURIComponent(role)}&state=${st}`;
const days = c => c && c.days ? c.days + ' days' : c && c.days_over ? 'over ' + c.days_over + ' days' : '&mdash;';
// Local sample only, matching the Intelligence home's sample watchlist.
const SAMPLE_WATCH = [['Wind turbine technician', 'TX'], ['Wind turbine technician', 'CO'],
  ['Solar O&M technician', 'CA'], ['Solar O&M technician', 'TX'], ['Project manager', 'CA']];

el('signOutLink').onclick = e => { e.preventDefault(); VTIntel.signOut(); };

// ---------------------------------------------------------------- the general report ------
// A market report, not a role report: the national picture, each sector, the states this
// account follows, then one line per followed role. The role detail lives on the role page
// and its own Download PDF (Role deep dive).
const SECTORS = [['Solar', 'Solar', '#F5B041'], ['Wind', 'Wind', '#4FB3FF'],
  ['Storage', 'Storage', '#B79CFF'], ['Grid', 'Grid & Utilities', '#FF6B6B']];
const openAll = st => Object.values(st.roles || {}).reduce((a, c) => a + (c.open || 0), 0);
const pct = v => Number(v).toFixed(1) + '%';
const signed = v => (v > 0 ? '+' : '') + Math.round(v).toLocaleString();

function topEmployers(st, n = 5){
  const tally = {};
  Object.values(st.roles || {}).forEach(c => (c.emp || []).forEach(([name, open]) => { tally[name] = (tally[name] || 0) + open; }));
  return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, n);
}
const topRoles = (st, n = 5) => Object.entries(st.roles || {}).map(([r, c]) => [r, c.open])
  .filter(([, o]) => o).sort((a, b) => b[1] - a[1]).slice(0, n);
const lines = (rows, fmt) => rows.length ? rows.map(([a, b]) => `<div class="line"><span>${a}</span><u>${fmt(b)}</u></div>`).join('')
  : '<p class="muted" style="font-size:13px;">Nothing open right now.</p>';

// Flags for a followed role: the same signals the role pages raise, as short tags.
function roleFlags(r){
  const c = cellOf(r.role, r.state), nat = D.national[r.role] || {}, b = blsOf(r.role, r.state), out = [];
  if (c.pay && b && b[1] && c.pay[1] < b[1]) out.push(['warn', 'Advertised pay below BLS 25th']);
  if (c.days && nat.days && c.days >= nat.days * 1.5) out.push(['warn', `Fills ${(c.days / nat.days).toFixed(1)}&times; slower than nationally`]);
  const top = (c.emp || [])[0];
  if (top && c.open >= 8 && top[1] / c.open >= 0.4) out.push(['', `${top[0]} holds ${Math.round(100 * top[1] / c.open)}% of openings`]);
  const cert = ((c.sig || {}).certs || [])[0];
  if (cert && cert[1] >= 40) out.push(['', `${cert[1]}% require ${cert[0]}`]);
  return out;
}

// Three market-level takeaways. Across the states followed when there are several; with
// one, that state against the national picture - comparing it with itself says nothing, and
// comparing it with every state surfaced South Dakota to a Texas-only account.
function marketTakeaways(states){
  const out = [];
  if (states.length === 1){
    const k = states[0], st = D.states[k], p = st.pipe, u = st.unemp, mv = st.move;
    if (p && p.mw.within_12mo){
      const dev = (p.top_developers || [])[0];
      out.push({ kind: 'Demand ahead', tone: 'good', figure: gw(p.mw.within_12mo),
        text: `due online in ${st.name} within 12 months${dev ? `, led by ${dev.entity.trim()}` : ''}.` });
    }
    if (u) out.push({ kind: 'Labour market', tone: u.latest < D.unemp_median ? 'warn' : '', figure: pct(u.latest),
      text: `unemployment in ${st.name}, against ${pct(D.unemp_median)} in the median state${u.latest < D.unemp_median
        ? '. Tighter than most: expect to pay up or recruit from further away.' : ', so there is more slack than in most states.'}` });
    if (mv) out.push({ kind: mv.net_households >= 0 ? 'People moving in' : 'People moving out', tone: mv.net_households >= 0 ? '' : 'warn',
      figure: signed(mv.net_households),
      text: mv.net_households >= 0 ? `more households moved into ${st.name} than left (${D.move_period}), so its labour pool is growing.`
        : `more households left ${st.name} than arrived (${D.move_period}), so its labour pool is shrinking.` });
    return out;
  }
  const pool = states.length >= 2 ? states : Object.keys(D.states);
  const best = (get, dir = 1) => pool.map(k => [k, get(D.states[k])]).filter(([, v]) => v != null && !isNaN(v))
    .sort((a, b) => dir * (b[1] - a[1]))[0];
  const pipe = best(st => st.pipe && st.pipe.mw.within_12mo);
  if (pipe){
    const st = D.states[pipe[0]], dev = (st.pipe.top_developers || [])[0];
    out.push({ kind: 'Demand ahead', tone: 'good', figure: gw(pipe[1]),
      text: `due online in ${st.name} within 12 months${dev ? `, led by ${dev.entity.trim()}` : ''}.` });
  }
  const tight = best(st => st.unemp && st.unemp.latest, -1);
  if (tight) out.push({ kind: 'Tightest labour market', tone: 'warn', figure: pct(tight[1]),
    text: `unemployment in ${D.states[tight[0]].name}, against ${pct(D.unemp_median)} in the median state. Expect to pay up or recruit from further away.` });
  const move = best(st => st.move && st.move.net_households);
  if (move && move[1] > 0) out.push({ kind: 'People moving in', tone: '', figure: signed(move[1]),
    text: `more households moved into ${D.states[move[0]].name} than left (${D.move_period}), so its labour pool is growing.` });
  return out;
}

function sectorOf(role, stateKey){
  let best = null, bestN = -1;
  SECTORS.forEach(([k]) => {
    const x = D.sectors[k], nat = x.national.roles.find(r => r[0] === role);
    if (!nat) return;
    const loc = (((x.states || {})[stateKey] || { roles: [] }).roles.find(r => r[0] === role) || [0, 0])[1];
    const n = loc * 100000 + nat[1];
    if (n > bestN){ best = k; bestN = n; }
  });
  return best;
}

function sectorBlock([k, label, colour]){
  const n = D.sectors[k].national, p = n.pipe;
  return `<section class="market sector" style="--c:${colour}">
    <div class="market-head"><h3><span class="dot"></span>${label}</h3></div>
    <div class="stats">
      <div><b>${n.workforce ? n.workforce.toLocaleString() : '&mdash;'}</b><span>${k === 'Grid' ? 'in grid modernisation' : 'people in ' + label.toLowerCase()}</span></div>
      <div><b>${n.open.toLocaleString()}</b><span>open roles &middot; ${n.nemp} employers</span></div>
      <div><b>${p ? gw(p.mw12) : '&mdash;'}</b><span>${p ? 'due online in 12 months' : 'no generation pipeline'}</span></div>
      <div><b>${p ? gw(p.mw) : '&mdash;'}</b><span>${p ? `planned in ${p.projects.toLocaleString()} projects` : ''}</span></div>
    </div>
    <div class="cols">
      <div><h4>Roles hired most</h4>${lines(n.roles.slice(0, 5).map(([r, o]) => [title(r), o]), v => v + ' open')}</div>
      <div><h4>Employers hiring most</h4>${lines(n.emp.slice(0, 5), v => v + ' open')}</div>
    </div>
  </section>`;
}

// A state seen through the account's sectors: workforce, open roles, pipeline, builders and
// the roles and employers lists all come from those sectors only. A posting that covers
// several technologies counts once per role and employer (the largest sector figure), not
// once per sector.
function sectorSlice(k, secs){
  const areas = secs.map(sec => D.sectors[sec].states[k]).filter(Boolean);
  const merge = key => { const m = new Map(); areas.forEach(a => (a[key] || []).forEach(([n, v]) => m.set(n, Math.max(m.get(n) || 0, v)))); return m; };
  const roles = merge('roles'), emp = merge('emp');
  const devs = new Map();
  areas.forEach(a => ((a.pipe || {}).dev || []).forEach(([n, mw]) => devs.set(n, (devs.get(n) || 0) + mw)));
  return {
    workforce: areas.reduce((t, a) => t + (a.workforce || 0), 0),
    open: [...roles.values()].reduce((t, v) => t + v, 0),
    mw12: areas.reduce((t, a) => t + ((a.pipe || {}).mw12 || 0), 0),
    hasPipe: areas.some(a => a.pipe),
    roles: [...roles.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5),
    emp: [...emp.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5),
    devs: [...devs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3),
  };
}

function stateBlock(k, secs, label){
  const st = D.states[k], p = st.pipe, mv = st.move, u = st.unemp, tr = st.train;
  const x = sectorSlice(k, secs);
  const devs = x.devs.map(([entity, mw]) => ({ entity, mw }));
  const facts = [];
  if (mv) facts.push(`<b>${signed(mv.net_households)}</b> net households moved in (${D.move_period})${mv.top_origins && mv.top_origins.length
    ? `, most from ${mv.top_origins.slice(0, 3).map(o => (D.states[o.state] || {}).name || o.state).join(', ')}` : ''}.`);
  if (tr && tr.total) facts.push(`<b>${tr.total.toLocaleString()}</b> completed trades and technical programmes in ${D.train_year}${
    (st.schools || []).length ? `, led by ${st.schools.slice(0, 2).map(x => x.name).join(' and ')}` : ''}.`);
  if (devs.length) facts.push(`Biggest builders: ${devs.map(d => `${d.entity.trim()} (${gw(d.mw)})`).join(', ')}.`);
  return `<section class="market">
    <div class="market-head"><h3>${st.name}</h3></div>
    <div class="stats">
      <div><b>${x.workforce ? x.workforce.toLocaleString() : '&mdash;'}</b><span>${label} workers</span></div>
      <div><b>${x.open.toLocaleString()}</b><span>open ${label} roles we track</span></div>
      <div><b>${x.hasPipe && x.mw12 ? gw(x.mw12) : '&mdash;'}</b><span>${label} due online in 12 months</span></div>
      <div><b>${u ? pct(u.latest) : '&mdash;'}</b><span>unemployment${u && u.year_ago != null ? ` &middot; ${pct(u.year_ago)} a year ago` : ''}</span></div>
    </div>
    ${facts.length ? `<p class="band">${facts.join(' ')}</p>` : ''}
    <div class="cols">
      <div><h4>Roles hiring most</h4>${lines(x.roles.map(([r, o]) => [title(r), o]), v => v + ' open')}</div>
      <div><h4>Employers hiring most</h4>${lines(x.emp, v => v + ' open')}</div>
    </div>
  </section>`;
}

function glanceTable(rows){
  return `<div class="panel"><table><thead><tr><th>Role and market</th><th class="n">Pay (BLS)</th><th class="n">Advertised</th>
    <th class="n">Open</th><th class="n">Days to fill</th><th class="screen-only"></th></tr></thead>
    <tbody>${rows.map(r => { const c = cellOf(r.role, r.state), b = blsOf(r.role, r.state), f = roleFlags(r);
      return `<tr><td><b>${title(r.role)}</b> <span class="muted">&middot; ${D.states[r.state].name}</span>
          ${f.length ? `<div class="flags">${f.map(([tone, t]) => `<span class="flag ${tone}">${t}</span>`).join('')}</div>` : ''}</td>
        <td class="n">${b ? money(b[0]) : '&mdash;'}</td>
        <td class="n">${c.pay ? money(c.pay[1]) : '&mdash;'}</td>
        <td class="n">${c.open}</td><td class="n">${days(c)}</td>
        <td class="n screen-only"><a class="deep" href="${link(r.role, r.state)}">Deep dive &rarr;</a></td></tr>`; }).join('')}</tbody></table></div>`;
}

function postingsTable(posts){
  return `<div class="panel"><table><thead><tr><th>Posting</th><th class="n">You advertise</th><th class="n">Market</th><th class="n">Gap</th><th class="n">Days live</th></tr></thead>
    <tbody>${posts.map(p => { const c = cellOf(p.role, p.state), m = c && c.pay ? c.pay[1] : null;
      const gap = m && p.advertised ? Math.round(100 * (p.advertised / m - 1)) : null;
      return `<tr><td>${p.title}<div class="muted" style="font-size:12px;">${(D.states[p.state] || {}).name || p.state}</div></td>
        <td class="n">${money(p.advertised)}</td><td class="n">${m ? money(m) : '&mdash;'}</td>
        <td class="n">${gap == null ? '&mdash;' : (gap > 0 ? '+' : '') + gap + '%'}</td>
        <td class="n">${p.days != null ? p.days : '&mdash;'}${c && c.days ? `<div class="muted" style="font-size:12px;">typical ${c.days}</div>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function render(rows, posts, follows){
  const month = new Date().toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  el('title').textContent = `Market report · ${month}`;
  el('printFor').textContent = month;

  const followed = [...new Set([...follows.markets.filter(k => D.states[k]), ...rows.map(r => r.state)])];
  const states = followed.length ? followed
    : Object.keys(D.states).sort((a, b) => openAll(D.states[b]) - openAll(D.states[a])).slice(0, 3);
  const nationalOpen = Object.values(D.national).reduce((a, c) => a + (c.open || 0), 0);
  const workforce = SECTORS.reduce((a, [k]) => a + (D.sectors[k].national.workforce || 0), 0);
  const soon = Object.values(D.states).reduce((a, st) => a + ((st.pipe || {}).mw || {}).within_12mo || 0, 0);
  const takeaways = marketTakeaways(states);
  // Only the sectors this account is in: the ones it chose, plus those its followed roles
  // belong to. Nothing about the others - a solar installer's report has no use for a wind
  // section. Nothing followed at all, no way to tell, so every sector.
  const mine = new Set([...follows.sectors, ...rows.map(r => sectorOf(r.role, r.state))].filter(Boolean));
  const sectors = mine.size ? SECTORS.filter(([k]) => mine.has(k)) : SECTORS;
  const secKeys = sectors.map(([k]) => k);
  const secLabel = sectors.length === SECTORS.length ? 'clean energy'
    : sectors.map(([, l]) => l.toLowerCase().replace('grid & utilities', 'grid')).join(' and ');

  const where = !followed.length ? 'the three busiest states'
    : states.length <= 3 ? states.map(k => D.states[k].name).join(states.length === 2 ? ' and ' : ', ')
    : `the ${states.length} states you follow`;
  el('lede').innerHTML = `Clean energy hiring nationally, ${mine.size ? `in ${secLabel}` : 'by sector'}, and in ${where}. Figures rebuilt ${D.generated}.`;
  el('content').innerHTML = `
    <div class="pulse">
      <div><b>${nationalOpen.toLocaleString()}</b><span>open clean energy roles we track nationally</span></div>
      <div><b>${workforce.toLocaleString()}</b><span>people working in solar, wind, storage and grid</span></div>
      <div><b>${gw(soon)}</b><span>due online nationally within 12 months</span></div>
      <div><b>${pct(D.unemp_median)}</b><span>unemployment in the median state</span></div>
    </div>
    ${takeaways.length ? `<h2>Key takeaways</h2><div class="takeaways">${takeaways.map(f =>
      `<div class="take ${f.tone}"><span class="k">${f.kind}</span><b>${f.figure}</b><p>${f.text}</p></div>`).join('')}</div>` : ''}
    ${sectors.length ? `<h2>${mine.size ? `Your ${plural(sectors.length, 'sector', 'sectors')}` : 'By sector'}</h2>
    <div class="sectors-grid${sectors.length === 1 ? ' one' : ''}">${sectors.map(sectorBlock).join('')}</div>` : ''}
    <h2>${followed.length ? `Your ${plural(states.length, 'state', 'states')}` : 'The busiest states'}</h2>
    ${!followed.length ? '<p class="band">Follow the roles and markets you hire in on the Intelligence page and this section becomes yours.</p>' : ''}
    ${states.map(k => stateBlock(k, secKeys, secLabel)).join('')}
    ${rows.length ? `<h2>Your roles at a glance</h2>${glanceTable(rows)}
      <p class="band" style="margin-top:.6rem;">Each role has a full deep dive, with its own Download PDF, on the role page.</p>` : ''}
    ${posts.length ? `<h2>Your live postings against their markets</h2>${postingsTable(posts)}` : ''}
    <p class="method">Pay (BLS) is what people already in the job earn: BLS Occupational Employment and Wage Statistics.
      Advertised pay is the bottom of the range employers post, from every posting we have seen in that market, live and
      closed, brought up to today by BLS wage growth. Time to fill is how long a search stays open, counting a repost within
      14 days as the same search and including searches still open; always-open pipeline postings are left out. Build pipeline
      is EIA-860M; workforce is the DOE US Energy &amp; Employment Report; unemployment is BLS LAUS; training is IPEDS;
      migration is IRS Statistics of Income. Figures rebuilt ${D.generated}. Prepared for your account by Verde Talent; not for
      redistribution.</p>`;
  el('pdfBtn').disabled = false;
}

el('pdfBtn').onclick = () => window.print();

(async () => {
  if (VTIntel.SAMPLE) el('switcher').hidden = false;
  const got = await VTIntel.load();
  if (got.status === 'signin') return VTIntel.signIn('employer-intel-report.html');
  // Not subscribed: the plan picker lives on the Intelligence page.
  if (got.status === 'locked') { location.replace('employer-intel-home.html'); return; }
  D = got.data;
  const [watch, posts, follows] = await Promise.all([VTIntel.watch.load(), VTIntel.myPostings(), VTIntel.follows.load()]);
  let rows = watch || (VTIntel.SAMPLE ? SAMPLE_WATCH.map(([role, state]) => ({ role, state })) : []);
  const mine = posts.filter(p => D.states[p.state] && cellOf(p.role, p.state));
  // Roles you are posting count as followed, as on the Intelligence home.
  mine.forEach(p => rows.push({ role: p.role, state: p.state }));
  const seen = new Set();
  rows = rows.filter(r => { const k = r.role + '|' + r.state; if (seen.has(k) || !cellOf(r.role, r.state)) return false; seen.add(k); return true; });
  render(rows, mine, follows);
})().catch(err => {
  console.error(err);
  el('content').innerHTML = '<p class="muted">The report could not load just now. Refresh the page, or email contact@verdetalent.com if it keeps happening.</p>';
});
</script>
</body>
</html>
