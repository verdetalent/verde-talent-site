<title>Reset Password — Verde Talent</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="/tabler-icons.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--pur:#B588FF;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:380px;padding:1.5rem;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1.75rem;}
.logo-img{height:64px;width:auto;display:block;}
.card{background:var(--card);border:0.5px solid var(--bdr);border-radius:16px;padding:1.75rem;}
.card h1{font-size:19px;font-weight:600;margin-bottom:6px;}
.card p.sub{font-size:13px;color:var(--t3);margin-bottom:1.5rem;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:5px;}
.field input{width:100%;background:#1A1A1A;border:0.5px solid var(--bdr2);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--t1);outline:none;font-family:var(--font-sans);}
.field input:focus{border-color:rgba(34,224,154,0.5);}
.btn-grn{background:var(--grn);color:#052e1e;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:var(--font-sans);margin-top:4px;}
.btn-grn:disabled{opacity:.6;cursor:default;}
.note{font-size:12px;margin-top:12px;text-align:center;}
.note.err{color:var(--cor);}
.note.ok{color:var(--grn);}
a{color:var(--grn);}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="index.html"><img src="logo.webp" alt="Verde Talent" class="logo-img"></a>
  <div class="card" id="formCard">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Enter a new password for your account below.</p>
    <div class="field"><label>New password</label><input type="password" id="rp-password" placeholder="At least 8 characters" autocomplete="new-password"/></div>
    <div class="field"><label>Confirm password</label><input type="password" id="rp-password-confirm" placeholder="Retype password" autocomplete="new-password"/></div>
    <button type="button" class="btn-grn" id="rpSubmit">Set password &rarr;</button>
    <div class="note" id="rpNote"></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://iqcyofkosjopxsfdufvy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fNT-RdlQa_K6O9dxPYxkA__mHmbJNH';

// Supabase's recovery-link redirect appends the session as a URL hash
// fragment (#access_token=...&type=recovery), not a query string - it
// never touches the server/history, which is why this has to be parsed
// client-side rather than read from location.search.
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const accessToken = hashParams.get('access_token');
const linkType = hashParams.get('type');
const note = document.getElementById('rpNote');
const submitBtn = document.getElementById('rpSubmit');

if (!accessToken || linkType !== 'recovery') {
  document.getElementById('subText').textContent = 'This reset link is invalid or has expired.';
  document.getElementById('formCard').querySelectorAll('.field, #rpSubmit').forEach(el => el.style.display = 'none');
  note.textContent = 'Request a new password reset link and try again.';
  note.className = 'note err';
}

submitBtn.addEventListener('click', async function(){
  const pw = document.getElementById('rp-password').value;
  const pwConfirm = document.getElementById('rp-password-confirm').value;
  note.textContent = '';
  if (pw.length < 8) {
    note.textContent = 'Password must be at least 8 characters.';
    note.className = 'note err';
    return;
  }
  if (pw !== pwConfirm) {
    note.textContent = 'Passwords do not match.';
    note.className = 'note err';
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${accessToken}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.msg || data?.error_description || 'Could not set password.');
    document.getElementById('subText').textContent = 'Your password has been updated.';
    document.getElementById('formCard').querySelectorAll('.field, #rpSubmit').forEach(el => el.style.display = 'none');
    note.innerHTML = 'You can now <a href="login.html">sign in</a> with your new password.';
    note.className = 'note ok';
  } catch(err) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Set password →';
    note.textContent = err.message || 'Something went wrong.';
    note.className = 'note err';
  }
});
</script>
</body>
