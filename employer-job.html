*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--pur:#B588FF;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;position:relative;}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;text-decoration:none;color:inherit;flex-shrink:0;}
.logo-img{height:104px;width:auto;display:block;}
.nav-toggle{display:none;background:none;border:0.5px solid var(--bdr2);color:var(--t2);width:44px;height:44px;border-radius:10px;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;}
.nav-links{display:flex;align-items:center;gap:1.1rem;font-size:13px;}
.nav-links a{color:var(--t2);text-decoration:none;white-space:nowrap;}
.nav-links a:hover{color:var(--grn);}
.nav-groups{display:flex;align-items:flex-end;flex:1;justify-content:space-evenly;margin:0 1.15rem;}
.nav-group{display:flex;flex-direction:column;gap:6px;}
.nav-group + .nav-group{margin-left:14px;padding-left:14px;border-left:0.5px solid var(--bdr2);}
.nav-group-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;height:12px;line-height:12px;}
.nav-group-label.grn{color:var(--grn);}
.nav-group-label.amb{color:var(--amb);}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.btn{padding:8px 16px;border-radius:9px;font-size:13px;cursor:pointer;border:none;font-family:var(--font-sans);white-space:nowrap;}
.btn-grn2{background:var(--grn);color:#052e1e;font-weight:500;}
.btn-ghost{background:none;border:0.5px solid var(--bdr2);color:var(--t2);}
.signin-wrap{position:relative;}
.signin-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:0.5px solid var(--bdr2);border-radius:10px;padding:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:60;}
.signin-menu.open{display:block;}
.signin-menu a{display:block;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--t2);text-decoration:none;}
.signin-menu a:hover{background:#1A1A1A;color:var(--t1);}
.signin-menu .si-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px 2px;}
.signin-menu .si-label.grn{color:var(--grn);}
.signin-menu .si-label.amb{color:var(--amb);}
@media (max-width:1200px){
  .nav{padding:1rem 1.25rem;}
  .nav-groups{gap:0;margin:0 .5rem;}
  .nav-group + .nav-group{margin-left:10px;padding-left:10px;}
  .nav-links{gap:.7rem;}
  .nav-right{gap:6px;}
  .nav-right .btn{padding:7px 12px;}
  #signinToggle{padding:7px 10px;}
}
@media (max-width:940px){
  .nav-toggle{display:flex;}
  .logo-img{height:64px;}
  .nav-groups{display:none;flex-direction:column;align-items:flex-start;gap:0;position:absolute;top:100%;left:0;right:0;background:var(--blk);border-bottom:0.5px solid var(--bdr);padding:1rem 1.5rem 1.25rem;z-index:50;margin:0;}
  .nav-groups.open{display:flex;}
  .nav-group{width:100%;padding-top:.85rem;margin-top:.85rem;border-top:0.5px solid var(--bdr2);}
  .nav-group:first-child{padding-top:0;margin-top:0;border-top:none;}
  .nav-group + .nav-group{margin-left:0;padding-left:0;border-left:none;}
  .nav-links{flex-direction:column;align-items:flex-start;gap:.7rem;margin-top:.5rem;}
  .nav-right{gap:6px;}
  .nav-right .btn{padding:6px 9px;font-size:11px;}
}
.wrap{max-width:760px;margin:0 auto;padding:2.5rem 2rem 4rem;}
.back-link{font-size:13px;color:var(--t3);text-decoration:none;display:inline-block;margin-bottom:1.5rem;}
.back-link:hover{color:var(--grn);}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--bdr2);color:var(--t2);margin:0 6px 6px 0;}
.tag.sector{font-weight:500;border-color:rgba(34,224,154,0.4);color:var(--grn);background:rgba(34,224,154,0.08);}
h1{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:.5rem;}
.co-line{font-size:15px;color:var(--t2);margin-bottom:.75rem;}
.meta-row{font-size:13px;color:var(--t3);display:flex;flex-wrap:wrap;gap:14px;margin-bottom:1.25rem;}
.meta-row span{display:flex;align-items:center;gap:5px;}
.apply-section{margin:1.5rem 0 2rem;padding:1.25rem;background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;}
.btn-apply{background:var(--grn);color:#052e1e;border:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-sans);}
.btn-apply:disabled{opacity:.6;cursor:default;}
.apply-note{font-size:13px;color:var(--t3);margin-top:10px;line-height:1.6;}
.apply-note a{color:var(--grn);}
.apply-note.error{color:var(--cor);}
.apply-note.success{color:var(--grn);}
.desc-title{font-weight:600;margin-bottom:.75rem;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;font-size:11px;}
.desc-body{font-size:14px;line-height:1.75;color:var(--t2);border-top:0.5px solid var(--bdr);padding-top:1.5rem;}
.desc-body p{margin:0 0 1rem;}
.desc-body p:last-child{margin-bottom:0;}
.desc-body strong{color:var(--t1);font-weight:600;}
.desc-body ul{margin:0 0 1rem 1.2rem;padding:0;}
.desc-body li{margin-bottom:.4rem;}
.state-note{font-size:14px;color:var(--t3);padding:3rem 0;text-align:center;}
footer{border-top:0.5px solid var(--bdr);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--t3);}
footer a{color:var(--t3);text-decoration:none;}

<script>
document.getElementById('navToggle').addEventListener('click', function(){
  document.getElementById('navGroups').classList.toggle('open');
});
document.getElementById('signinToggle').addEventListener('click', function(e){
  e.stopPropagation();
  document.getElementById('signinMenu').classList.toggle('open');
});
document.addEventListener('click', function(){
  document.getElementById('signinMenu').classList.remove('open');
});

const SUPABASE_URL = 'https://iqcyofkosjopxsfdufvy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fNT-RdlQa_K6O9dxPYxkA__mHmbJNH';
const SEND_APPLICATION_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/send-application`;

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Renders the crawler/post-job upload's shared plain-text-with-markup
// convention (**bold** headers, "• " bullet lines) as real HTML -
// same rules as description_to_html() in export_job_pages_to_verde_talent.py,
// just needed client-side here since these postings are fetched live from
// Supabase rather than pre-rendered by the Python export pipeline.
function descriptionToHtml(description) {
  if (!description) return '';
  const parts = [];
  let listItems = [];
  function flushList() {
    if (listItems.length) {
      parts.push('<ul>' + listItems.map(i => `<li>${i}</li>`).join('') + '</ul>');
      listItems = [];
    }
  }
  function inlineBold(line) {
    return escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  description.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith('• ')) {
      listItems.push(inlineBold(line.slice(2).trim()));
    } else {
      flushList();
      parts.push(`<p>${inlineBold(line)}</p>`);
    }
  });
  flushList();
  return parts.join('');
}

function getStoredSession() {
  try {
    const raw = localStorage.getItem('vt_session');
    if (!raw) return null;
    const session = JSON.parse(raw);
    if (!session.access_token || session.expires_at < Date.now()) return null;
    return session;
  } catch {
    return null;
  }
}

async function handleApplyClick(btn, jobPostingId) {
  const note = document.getElementById('applyNote');
  note.className = 'apply-note';
  note.innerHTML = '';

  const session = getStoredSession();
  if (!session) {
    note.className = 'apply-note error';
    note.innerHTML = 'Log in or <a href="create-profile.html">create a profile</a> to apply with your resume — <a href="login.html">sign in →</a>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending your application…';

  try {
    const res = await fetch(SEND_APPLICATION_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ job_posting_id: jobPostingId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not send your application.');

    btn.textContent = 'Application sent ✓';
    note.className = 'apply-note success';
    note.textContent = 'Your resume was sent to the employer.';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Apply with Verde Talent profile →';
    note.className = 'apply-note error';
    note.textContent = err.message || 'Something went wrong — please try again.';
  }
}

(async function main() {
  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');
  if (!id) {
    content.textContent = 'No job specified.';
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/public_job_postings?id=eq.${id}&select=*`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
    });
    const rows = await res.json();
    if (!res.ok || !rows.length) {
      content.textContent = 'This posting is no longer available.';
      return;
    }
    const job = rows[0];
    document.title = `${job.job_title} at ${job.company_name} — Verde Talent`;

    const metaParts = [];
    metaParts.push(`<span><i class="ti ti-map-pin"></i>${escapeHtml(job.location || 'Location not listed')}</span>`);
    if (job.employment_type) metaParts.push(`<span><i class="ti ti-briefcase"></i>${escapeHtml(job.employment_type)}</span>`);
    if (job.salary_min && job.salary_max && job.salary_period) {
      const salaryText = job.salary_period === 'hour'
        ? `$${job.salary_min}–$${job.salary_max}/hr`
        : `$${Math.round(job.salary_min / 1000)}k–$${Math.round(job.salary_max / 1000)}k/yr`;
      metaParts.push(`<span><i class="ti ti-currency-dollar"></i>${escapeHtml(salaryText)}</span>`);
    }

    const sectorTag = job.sector ? `<span class="tag sector">${escapeHtml(job.sector)}</span>` : '';

    let applyHtml;
    if (job.apply_url) {
      applyHtml = `<a class="btn-apply" style="text-decoration:none;display:inline-block;" href="${escapeHtml(job.apply_url)}" target="_blank" rel="noopener">Apply on ${escapeHtml(job.company_name)}'s site &rarr;</a>`;
    } else {
      applyHtml = `<button type="button" class="btn-apply" onclick="handleApplyClick(this, '${job.id}')">Apply with Verde Talent profile &rarr;</button><div class="apply-note" id="applyNote"></div>`;
    }

    content.outerHTML = `
      <h1>${escapeHtml(job.job_title)}</h1>
      <div class="co-line">${escapeHtml(job.company_name)}</div>
      <div class="meta-row">${metaParts.join('')}</div>
      <div>${sectorTag}</div>
      <div class="apply-section">${applyHtml}</div>
      <div class="desc-title">Full description</div>
      <div class="desc-body">${descriptionToHtml(job.job_description)}</div>
    `;
  } catch (err) {
    console.error('Failed to load job posting:', err);
    content.textContent = 'Something went wrong loading this job.';
  }
})();
</script>
