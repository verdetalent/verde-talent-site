<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--pur:#B588FF;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;text-decoration:none;color:inherit;}
.logo-img{height:104px;width:auto;display:block;}
.nav-right{font-size:13px;color:var(--t3);}
.nav-right a{color:var(--t2);text-decoration:none;}
.nav-right a:hover{color:var(--grn);}
.wrap{max-width:440px;margin:3rem auto;padding:0 1.5rem;}
.card{background:var(--card);border:0.5px solid var(--bdr);border-radius:16px;padding:1.75rem;}
.card h1{font-size:19px;font-weight:500;margin-bottom:6px;}
.card p.sub{font-size:13px;color:var(--t3);margin-bottom:1.5rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:5px;}
.field input{width:100%;background:#1A1A1A;border:0.5px solid var(--bdr2);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--t1);outline:none;font-family:var(--font-sans);}
.field input:focus{border-color:rgba(34,224,154,0.5);}
/* Chrome forces a light background on autofilled inputs (e.g. a
   remembered email) that no background-color rule above can override -
   only this combination of an inset box-shadow and text-fill-color can. */
.field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px #1A1A1A inset;
  -webkit-text-fill-color:var(--t1);
  caret-color:var(--t1);
  transition:background-color 9999s ease-in-out 0s;
}
.btn-grn{background:var(--grn);color:#052e1e;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:var(--font-sans);margin-top:6px;}
.btn-grn:disabled{opacity:0.6;cursor:default;}
.note{font-size:12px;color:var(--t3);margin-top:12px;text-align:center;}
.foot-link{font-size:13px;color:var(--t3);text-align:center;margin-top:1.25rem;}
.foot-link a{color:var(--grn);text-decoration:none;}
</style>

<body>
<nav class="nav">
  <a class="logo" href="index.html"><img src="logo.webp" alt="Verde Talent" class="logo-img"></a>
  <div class="nav-right"><a href="index.html">← Back to Verde Talent</a></div>
</nav>
<div class="wrap">
  <div class="card" id="loginCard">
    <h1><span style="color:var(--grn);">Candidate</span> sign in</h1>
    <p class="sub">View the profile you created with Verde Talent.</p>
    <div class="note" id="createdNote" style="display:none;background:rgba(34,224,154,0.06);border:0.5px solid rgba(34,224,154,0.25);border-radius:10px;padding:10px 12px;margin-bottom:16px;color:var(--grn);text-align:left;">Account created — sign in below to view your profile.</div>
    <div class="field"><label>Email</label><input type="email" id="li-email" placeholder="you@example.com"/></div>
    <div class="field"><label>Password</label><input type="password" id="li-password" placeholder="Your password"/></div>
    <button type="button" class="btn-grn" id="loginBtn">Sign in →</button>
    <div class="note" id="loginNote"></div>
    <div class="foot-link">Don't have a profile yet? <a href="create-profile.html">Create one</a></div>
  </div>

</div>
<script>
const SUPABASE_URL = 'https://iqcyofkosjopxsfdufvy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fNT-RdlQa_K6O9dxPYxkA__mHmbJNH';

if(new URLSearchParams(window.location.search).get('created') === '1'){
  document.getElementById('createdNote').style.display = 'block';
}

// Anyone could have bookmarked jobs anonymously (localStorage only) before
// ever signing in - the moment they do sign in, those saves get folded
// into their account so they're not silently lost. Prefer:
// resolution=merge-duplicates makes this a safe upsert against the
// unique(candidate_id, save_key) constraint, so re-running this on every
// login is harmless rather than erroring on already-synced rows.
async function syncLocalSavedJobs(accessToken, candidateId){
  const local = JSON.parse(localStorage.getItem('vt_saved_jobs') || '[]');
  if(!local.length) return;
  const rows = local.map((j) => ({
    candidate_id: candidateId,
    save_key: j.save_key,
    job_title: j.job_title || null,
    company: j.company || null,
    location: j.location || null,
  }));
  await fetch(`${SUPABASE_URL}/rest/v1/saved_jobs`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify(rows),
  });
}

document.getElementById('loginBtn').addEventListener('click', async function(){
  const btn = this;
  const note = document.getElementById('loginNote');
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  if(!email || !password){
    note.textContent = 'Enter your email and password.';
    note.style.color = 'var(--cor)';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  note.textContent = '';

  try {
    const tokenRes = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const tokenData = await tokenRes.json();
    if(!tokenRes.ok){
      throw new Error(tokenData?.error_description || tokenData?.msg || 'Incorrect email or password.');
    }
    const accessToken = tokenData.access_token;
    const userId = tokenData.user?.id;

    // Persisted so other pages (e.g. the "Apply" flow on jobs.html) can
    // tell a candidate is already signed in without asking them to log in
    // again on every page - refresh_token is included so a future version
    // can silently renew an expired access_token instead of forcing a
    // re-login the moment the 1-hour token lifetime is up.
    localStorage.setItem('vt_session', JSON.stringify({
      access_token: accessToken,
      refresh_token: tokenData.refresh_token,
      user_id: userId,
      email: tokenData.user?.email,
      expires_at: Date.now() + (tokenData.expires_in || 3600) * 1000,
    }));

    const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/candidates?user_id=eq.${userId}&select=*`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${accessToken}` },
    });
    const profiles = await profileRes.json();
    if(!profileRes.ok || !profiles.length){
      throw new Error('Signed in, but no profile was found on this account.');
    }
    const p = profiles[0];

    // candidate_id (not just the auth user_id) is what saved_jobs and any
    // other candidate-owned table key off of - stashing it now saves every
    // other page from having to re-fetch the candidates row just to learn
    // its own id.
    const session = JSON.parse(localStorage.getItem('vt_session') || '{}');
    session.candidate_id = p.id;
    localStorage.setItem('vt_session', JSON.stringify(session));

    syncLocalSavedJobs(accessToken, p.id).catch((err) => console.error('Saved-jobs sync failed:', err));

    window.location.href = 'dashboard.html';
  } catch(err){
    btn.disabled = false;
    btn.textContent = 'Sign in →';
    note.textContent = err.message || 'Something went wrong — please try again.';
    note.style.color = 'var(--cor)';
    console.error('Login failed:', err);
  }
});
</script>
</body>
