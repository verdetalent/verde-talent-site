<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blk:#0A0A0A;--card:#131313;--card2:#1A1A1A;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(255,255,255,0.14);
  --grn:#22E09A;--blu:#4FB3FF;--amb:#FFB547;--pur:#B588FF;--cor:#FF7055;
  --t1:#FFFFFF;--t2:rgba(255,255,255,0.6);--t3:rgba(255,255,255,0.35);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--blk);color:var(--t1);font-family:var(--font-sans);min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bdr);max-width:1400px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;text-decoration:none;color:inherit;}
.logo-img{height:104px;width:auto;display:block;}
.nav-right{font-size:13px;color:var(--t3);}
.nav-right a{color:var(--t2);text-decoration:none;}
.nav-right a:hover{color:var(--grn);}
.wrap{max-width:440px;margin:3rem auto;padding:0 1.5rem;}
.card{background:var(--card);border:0.5px solid var(--bdr);border-radius:16px;padding:1.75rem;}
.card h1{font-size:19px;font-weight:500;margin-bottom:6px;}
.card p.sub{font-size:13px;color:var(--t3);margin-bottom:1.5rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:5px;}
.field input{width:100%;background:#1A1A1A;border:0.5px solid var(--bdr2);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--t1);outline:none;font-family:var(--font-sans);}
.field input:focus{border-color:rgba(34,224,154,0.5);}
.btn-grn{background:var(--grn);color:#052e1e;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:var(--font-sans);margin-top:6px;}
.btn-grn:disabled{opacity:0.6;cursor:default;}
.note{font-size:12px;color:var(--t3);margin-top:12px;text-align:center;}
.foot-link{font-size:13px;color:var(--t3);text-align:center;margin-top:1.25rem;}
.foot-link a{color:var(--grn);text-decoration:none;cursor:pointer;}
</style>

<body>
<nav class="nav">
  <a class="logo" href="index.html"><img src="logo.webp" alt="Verde Talent" class="logo-img"></a>
  <div class="nav-right"><a href="index.html">← Back to Verde Talent</a></div>
</nav>
<div class="wrap">
  <div class="card">
    <h1 id="cardTitle"><span style="color:var(--amb);">Employer</span> sign in</h1>
    <p class="sub" id="cardSub">Manage the jobs you've posted to Verde Talent.</p>
    <div class="field"><label>Email</label><input type="email" id="li-email" placeholder="hiring@acmesolar.com"/></div>
    <div class="field"><label>Password</label><input type="password" id="li-password" placeholder="Your password"/></div>
    <button type="button" class="btn-grn" id="loginBtn">Sign in →</button>
    <div class="note" id="loginNote"></div>
    <div class="foot-link" id="toggleLink">New here? <a>Create an employer account</a></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://iqcyofkosjopxsfdufvy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8fNT-RdlQa_K6O9dxPYxkA__mHmbJNH';

let mode = 'signin';
const cardTitle = document.getElementById('cardTitle');
const cardSub = document.getElementById('cardSub');
const loginBtn = document.getElementById('loginBtn');
const toggleLink = document.getElementById('toggleLink');

// Event delegation on the container, since its inner <a> is replaced via
// innerHTML each time the mode switches - a listener bound directly to the
// old <a> would be lost the moment its markup is replaced.
toggleLink.addEventListener('click', function(e){
  if (e.target.tagName !== 'A') return;
  mode = mode === 'signin' ? 'signup' : 'signin';
  if (mode === 'signup') {
    cardTitle.innerHTML = 'Create an <span style="color:var(--amb);">employer</span> account';
    cardSub.textContent = 'So you can manage your postings without hunting for an emailed link.';
    loginBtn.textContent = 'Create account →';
    toggleLink.innerHTML = 'Already have an account? <a>Sign in</a>';
  } else {
    cardTitle.innerHTML = '<span style="color:var(--amb);">Employer</span> sign in';
    cardSub.textContent = "Manage the jobs you've posted to Verde Talent.";
    loginBtn.textContent = 'Sign in →';
    toggleLink.innerHTML = 'New here? <a>Create an employer account</a>';
  }
});

document.getElementById('loginBtn').addEventListener('click', async function(){
  const btn = this;
  const note = document.getElementById('loginNote');
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  if(!email || !password){
    note.textContent = 'Enter your email and password.';
    note.style.color = 'var(--cor)';
    return;
  }
  if (mode === 'signup' && password.length < 6) {
    note.textContent = 'Password must be at least 6 characters.';
    note.style.color = 'var(--cor)';
    return;
  }

  btn.disabled = true;
  btn.textContent = mode === 'signup' ? 'Creating account…' : 'Signing in…';
  note.textContent = '';

  try {
    const endpoint = mode === 'signup' ? 'signup' : 'token?grant_type=password';
    const authRes = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const authData = await authRes.json();
    if(!authRes.ok){
      throw new Error(authData?.msg || authData?.error_description || (mode === 'signup'
        ? 'Could not create account — that email may already be registered. Try signing in instead.'
        : 'Incorrect email or password.'));
    }
    const accessToken = authData.access_token;
    const userId = authData.user?.id;
    if(!accessToken || !userId){
      throw new Error('Account created, but email confirmation is required before you can sign in. Check your inbox, confirm, then sign in.');
    }

    // Kept in its own key (separate from the candidate "vt_session") so a
    // person can in principle hold both a candidate and an employer
    // session in the same browser without one overwriting the other.
    localStorage.setItem('vt_employer_session', JSON.stringify({
      access_token: accessToken,
      refresh_token: authData.refresh_token,
      user_id: userId,
      email: authData.user?.email,
      expires_at: Date.now() + (authData.expires_in || 3600) * 1000,
    }));

    window.location.href = 'employer-dashboard.html';
  } catch(err){
    btn.disabled = false;
    btn.textContent = mode === 'signup' ? 'Create account →' : 'Sign in →';
    note.textContent = err.message || 'Something went wrong — please try again.';
    note.style.color = 'var(--cor)';
    console.error('Employer auth failed:', err);
  }
});
</script>
</body>
</html>
